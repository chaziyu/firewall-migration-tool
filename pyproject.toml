[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firewall-migration-tool"
version = "0.2.0"
description = "Multi-vendor firewall configuration extraction and reporting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "flask>=3.0.0",
    "openpyxl>=3.1.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]
reports = [
    "openpyxl>=3.1.0",
]
deployment = [
    "netmiko>=4.0",
]
collection = [
    "netmiko>=4.0",
    "requests>=2.28",
]
ai = [
    "requests>=2.28",
]

[project.scripts]
fwmigrate = "fwmigrate.main:cli"
