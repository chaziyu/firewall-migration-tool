[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firewall-migration-tool"
version = "0.2.0"
description = "Universal Multi-Vendor Firewall Migration Platform using an Intermediate Representation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography",
    "pydantic>=2.0,<3.0",
    "lxml>=5.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "flask>=3.0.0",
    "requests>=2.28.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
cisco = [
    "ciscoconfparse>=1.9.0",
]
checkpoint = [
    "checkpoint-api-python-sdk>=1.4",
]
juniper = [
    "junos-eznc>=2.7.0",
]
reports = [
    "openpyxl>=3.1.0",
]

[project.scripts]
fwmigrate = "fwmigrate.main:cli"
fg2pan = "fwmigrate.main:cli"
