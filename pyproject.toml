[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firewall-migration-tool"
version = "0.2.3"
description = "Vendor-native firewall reporting and pair-specific migration planning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0,<3.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "flask>=3.0.0",
    "openpyxl>=3.1.0",
    "gunicorn>=23.0,<27.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    "requests>=2.28",
    "ruff>=0.16.10,<0.18",
]
collection = [
    "netmiko>=4.0",
    "requests>=2.28",
]

[project.scripts]
fwmigrate = "fwmigrate.main:cli"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
