domain: casb
part: 1
parts: 1
sections:
- path: casb profile
  mode: table
  key: <name>
  fields:
    comment: var-string
  nested:
  - name: saas-application
    mode: table
    key: <name>
    fields:
      domain-control: enum
      domain-control-domains: identifier-list
      log: enum
      safe-search: enum
      safe-search-control: identifier-list
      status: enum
      tenant-control: enum
      tenant-control-tenants: identifier-list
    nested:
    - name: access-rule
      mode: table
      key: <name>
      fields:
        action: enum
        bypass: option-list
    - name: custom-control
      mode: table
      key: <name>
      nested:
      - name: option
        mode: table
        key: <name>
        fields:
          user-input: identifier-list
- path: casb saas-application
  mode: table
  key: <name>
  fields:
    casb-name: string
    description: string
    domains: identifier-list
    status: enum
    type: enum
    uuid: string
- path: casb user-activity
  mode: table
  key: <name>
  fields:
    application: string
