        case-sensitive: enum
        direction: option
        header-name: string
        search-key: string
        search-pattern: enum
        target: enum
        value-from-input: enum
        values: identifier-list
  - name: match
    mode: table
    key: <id>
    fields:
      strategy: enum
    nested:
    - name: rules
      mode: table
      key: <id>
      fields:
        case-sensitive: enum
        domains: identifier-list
        header-name: string
        match-pattern: enum
        match-value: string
        methods: identifier-list
        negate: enum
        type: enum
