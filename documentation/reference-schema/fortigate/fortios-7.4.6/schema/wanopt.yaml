domain: wanopt
part: 1
parts: 1
sections:
- path: wanopt auth-group
  mode: table
  key: <name>
  fields:
    auth-method: enum
    cert: string
    peer: string
    peer-accept: enum
    psk: password!sensitive
  model_dependent: true
- path: wanopt cache-service
  mode: singleton
  fields:
    acceptable-connections: enum
    collaboration: enum
    device-id: string
    prefer-scenario: enum
  nested:
  - name: dst-peer
    mode: table
    key: <device-id>
    fields:
      auth-type: integer
      encode-type: integer
      ip: ipv4-address-any
      priority: integer
  - name: src-peer
    mode: table
    key: <device-id>
    fields:
      auth-type: integer
      encode-type: integer
      ip: ipv4-address-any
      priority: integer
  model_dependent: true
- path: wanopt content-delivery-network-rule
  mode: table
  key: <name>
  fields:
    category: enum
    comment: var-string
    host-domain-name-suffix: identifier-list
    request-cache-control: enum
    response-cache-control: enum
    response-expires: enum
    status: enum
    updateserver: enum
  nested:
  - name: rules
    mode: table
    key: <name>
    fields:
      match-mode: enum
      skip-rule-mode: enum
    nested:
    - name: content-id
      mode: singleton
      fields:
        end-direction: enum
        end-skip: integer
        end-str: string
        range-str: string
        start-direction: enum
        start-skip: integer
        start-str: string
        target: enum
    - name: match-entries
      mode: table
      key: <id>
      fields:
        pattern: identifier-list
        target: enum
    - name: skip-entries
      mode: table
      key: <id>
      fields:
        pattern: identifier-list
        target: enum
  model_dependent: true
- path: wanopt peer
  mode: table
  key: <peer-host-id>
  fields:
    ip: ipv4-address-any
  model_dependent: true
- path: wanopt profile
  mode: table
  key: <name>
  fields:
    auth-group: string
    comments: var-string
    transparent: enum
  nested:
  - name: cifs
    mode: singleton
    fields:
      byte-caching: enum
      prefer-chunking: enum
      protocol-opt: enum
      secure-tunnel: enum
      status: enum
      tunnel-sharing: enum
  - name: ftp
    mode: singleton
    fields:
      byte-caching: enum
      prefer-chunking: enum
      protocol-opt: enum
      secure-tunnel: enum
      status: enum
      tunnel-sharing: enum
  - name: http
    mode: singleton
    fields:
      byte-caching: enum
      prefer-chunking: enum
      protocol-opt: enum
      secure-tunnel: enum
      ssl: enum
      status: enum
      tunnel-sharing: enum
  - name: mapi
    mode: singleton
    fields:
      byte-caching: enum
      secure-tunnel: enum
      status: enum
      tunnel-sharing: enum
  - name: tcp
    mode: singleton
    fields:
      byte-caching: enum
      byte-caching-opt: enum
      port: opaque-user
      secure-tunnel: enum
      ssl: enum
      ssl-port: opaque-user
      status: enum
      tunnel-sharing: enum
  model_dependent: true
- path: wanopt remote-storage
  mode: singleton
  fields:
    local-cache-id: string
    remote-cache-id: string
    remote-cache-ip: ipv4-address-any
    status: enum
  model_dependent: true
- path: wanopt settings
  mode: singleton
  fields:
    auto-detect-algorithm: enum
    host-id: string
    tunnel-optimization: enum
    tunnel-ssl-algorithm: enum
  model_dependent: true
- path: wanopt webcache
  mode: singleton
  fields:
    always-revalidate: enum
    cache-by-default: enum
    cache-cookie: enum
    cache-expired: enum
    default-ttl: integer
    external: enum
    fresh-factor: integer
    host-validate: enum
    ignore-conditional: enum
    ignore-ie-reload: enum
    ignore-ims: enum
    ignore-pnc: enum
    max-object-size: integer
    max-ttl: integer
    min-ttl: integer
    neg-resp-time: integer
    reval-pnc: enum
  model_dependent: true
