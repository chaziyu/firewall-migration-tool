- path: router static
  mode: table
  key: <seq-num>
  key_type: integer
  description: Configure IPv4 static routing tables.
  fields:
    bfd:
      source_type: enum
      fortios_type: option
      description: Enable/disable Bidirectional Forwarding Detection (BFD).
      options:
      - value: enable
      - value: disable
      default:
        value: disable
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: bfd}
    blackhole:
      source_type: enum
      fortios_type: option
      description: Enable/disable black hole.
      options:
      - value: enable
      - value: disable
      default:
        value: disable
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: blackhole}
    comment:
      source_type: var-string
      fortios_type: var-string
      description: Optional comments.
      length: {max: 255}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: comment}
    device:
      source_type: string
      fortios_type: string
      description: Gateway out interface or tunnel.
      length: {max: 35}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: device}
      semantic:
        reference: {kind: interface, target_paths: [system interface], cardinality: one}
        evidence:
          status: project_semantic
          source: {document: FortiOS 7.4.6 CLI Reference, config_path: router static, parameter: device}
    distance:
      source_type: integer
      fortios_type: integer
      description: Administrative distance.
      range: {min: 1, max: 255}
      default: {value: 10}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: distance}
    dst:
      source_type: ipv4-classnet
      fortios_type: ipv4-classnet
      description: Destination IP and mask for this route.
      default: {value: 0.0.0.0 0.0.0.0}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: dst}
    dstaddr:
      source_type: string
      fortios_type: string
      description: Name of firewall address or address group.
      length: {max: 79}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: dstaddr}
      semantic:
        reference:
          kind: ipv4-address-reference
          target_paths: [firewall address, firewall addrgrp]
          cardinality: one
        evidence:
          status: project_semantic
          source: {document: FortiOS 7.4.6 CLI Reference, config_path: router static, parameter: dstaddr}
    dynamic-gateway:
      source_type: enum
      fortios_type: option
      description: Enable use of dynamic gateway retrieved from a DHCP or PPP server.
      options:
      - value: enable
      - value: disable
      default: {value: disable}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: dynamic-gateway}
    gateway:
      source_type: ipv4-address
      fortios_type: ipv4-address
      description: Gateway IP for this route.
      default: {value: 0.0.0.0}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: gateway}
    internet-service:
      source_type: integer
      fortios_type: integer
      description: Application ID in the Internet service database.
      range: {min: 0, max: 4294967295}
      default: {value: 0}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: internet-service}
    internet-service-custom:
      source_type: string
      fortios_type: string
      description: Application name in the Internet service custom database.
      length: {max: 64}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: internet-service-custom}
    link-monitor-exempt:
      source_type: enum
      fortios_type: option
      description: Enable/disable withdrawal of this static route when link monitor or health check is down.
      options:
      - value: enable
      - value: disable
      default: {value: disable}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: link-monitor-exempt}
    preferred-source:
      source_type: ipv4-address
      fortios_type: ipv4-address
      description: Preferred source IP for this route.
      default: {value: 0.0.0.0}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: preferred-source}
    priority:
      source_type: integer
      fortios_type: integer
      description: Administrative priority.
      range: {min: 1, max: 65535}
      default: {value: 1}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: priority}
    sdwan-zone:
      source_type: identifier-list
      fortios_type: string
      description: Choose SD-WAN Zone. SD-WAN zone name.
      length: {max: 79}
      cardinality: list
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: sdwan-zone}
      semantic:
        reference: {kind: sdwan-zone, target_paths: [system sdwan zone], cardinality: many}
        evidence:
          status: project_semantic
          source: {document: FortiOS 7.4.6 CLI Reference, config_path: router static, parameter: sdwan-zone}
    src:
      source_type: ipv4-classnet
      fortios_type: ipv4-classnet
      description: Source prefix for this route.
      default: {value: 0.0.0.0 0.0.0.0}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: src}
    status:
      source_type: enum
      fortios_type: option
      description: Enable/disable this static route.
      options:
      - value: enable
      - value: disable
      default: {value: enable}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: status}
    tag:
      source_type: integer
      fortios_type: integer
      description: Route tag.
      range: {min: 0, max: 4294967295}
      default: {value: 0}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: tag}
    vrf:
      source_type: integer
      fortios_type: integer
      description: Virtual Routing Forwarding ID.
      range: {min: 0, max: 251}
      default: {value: unspecified}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: vrf}
    weight:
      source_type: integer
      fortios_type: integer
      description: Administrative weight.
      range: {min: 0, max: 255}
      default: {value: 0}
      evidence:
        status: documented
        source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static, parameter: weight}
  evidence:
    status: documented
    source: {document: FortiOS 7.4.6 CLI Reference, document_id: 01-746-912654-20241212, config_path: router static}
  semantic:
    migration_relevance: migration_relevant
    evidence:
      status: project_semantic
      source: {document: FortiOS 7.4.6 CLI Reference, config_path: router static}
