domain: router
part: 3
parts: 3
sections:
- path: router route-map
  mode: table
  key: <name>
  fields:
    comments: string
  nested:
  - name: rule
    mode: table
    key: <id>
    fields:
      action: enum
      match-as-path: string
      match-community: string
      match-community-exact: enum
      match-extcommunity: string
      match-extcommunity-exact: enum
      match-interface: string
      match-ip-address: string
      match-ip-nexthop: string
      match-ip6-address: string
      match-ip6-nexthop: string
      match-metric: integer
      match-origin: enum
      match-route-type: enum
      match-tag: integer
      match-vrf: integer
      set-aggregator-as: integer
      set-aggregator-ip: ipv4-address-any
      set-aspath: identifier-list
      set-aspath-action: enum
      set-atomic-aggregate: enum
      set-community: identifier-list
      set-community-additive: enum
      set-community-delete: string
      set-dampening-max-suppress: integer
      set-dampening-reachability-half-life: integer
      set-dampening-reuse: integer
      set-dampening-suppress: integer
      set-dampening-unreachability-half-life: integer
      set-extcommunity-rt: identifier-list
      set-extcommunity-soo: identifier-list
      set-ip-nexthop: ipv4-address
      set-ip-prefsrc: ipv4-address
      set-ip6-nexthop: ipv6-address
      set-ip6-nexthop-local: ipv6-address
      set-local-preference: integer
      set-metric: integer
      set-metric-type: enum
      set-origin: enum
      set-originator-id: ipv4-address-any
      set-priority: integer
      set-route-tag: integer
      set-tag: integer
      set-vpnv4-nexthop: ipv4-address
      set-vpnv6-nexthop: ipv6-address
      set-vpnv6-nexthop-local: ipv6-address
      set-weight: integer
- path: router setting
  mode: singleton
  fields:
    hostname: string
    show-filter: string
- path: router static
  mode: table
  key: <seq-num>
  fields:
    bfd: enum
    blackhole: enum
    comment: var-string
    device: string
    distance: integer
    dst: ipv4-classnet
    dstaddr: string
    dynamic-gateway: enum
    gateway: ipv4-address
    internet-service: integer
    internet-service-custom: string
    link-monitor-exempt: enum
    preferred-source: ipv4-address
    priority: integer
    sdwan-zone: identifier-list
    src: ipv4-classnet
    status: enum
    tag: integer
    vrf: integer
    weight: integer
- path: router static6
  mode: table
  key: <seq-num>
  fields:
    bfd: enum
    blackhole: enum
    comment: var-string
    device: string
    devindex: integer
    distance: integer
    dst: ipv6-network
    dstaddr: string
    dynamic-gateway: enum
    gateway: ipv6-address
    link-monitor-exempt: enum
    priority: integer
    sdwan-zone: identifier-list
    status: enum
    vrf: integer
    weight: integer
