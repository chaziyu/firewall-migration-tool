domain: dnsfilter
part: 1
parts: 1
sections:
- path: dnsfilter domain-filter
  mode: table
  key: <id>
  fields:
    comment: var-string
    name: string
  nested:
  - name: entries
    mode: table
    key: <id>
    fields:
      action: enum
      domain: string
      status: enum
      type: enum
- path: dnsfilter profile
  mode: table
  key: <name>
  fields:
    block-action: enum
    block-botnet: enum
    comment: var-string
    external-ip-blocklist: identifier-list
    log-all-domain: enum
    redirect-portal: ipv4-address
    redirect-portal6: ipv6-address
    safe-search: enum
    sdns-domain-log: enum
    sdns-ftgd-err-log: enum
    strip-ech: enum
    transparent-dns-database: identifier-list
    youtube-restrict: enum
  nested:
  - name: dns-translation
    mode: table
    key: <id>
    fields:
      addr-type: enum
      dst: ipv4-address
      dst6: ipv6-address
      netmask: ipv4-netmask
      prefix: integer
      src: ipv4-address
      src6: ipv6-address
      status: enum
  - name: domain-filter
    mode: singleton
    fields:
      domain-filter-table: integer
  - name: ftgd-dns
    mode: singleton
    fields:
      options: option-list
    nested:
    - name: filters
      mode: table
      key: <id>
      fields:
        action: enum
        category: integer
        log: enum
