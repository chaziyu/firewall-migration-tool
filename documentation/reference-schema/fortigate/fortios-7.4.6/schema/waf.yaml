domain: waf
part: 1
parts: 1
sections:
- path: waf main-class
  mode: table
  key: <id>
  fields:
    name: string
- path: waf profile
  mode: table
  key: <name>
  fields:
    comment: var-string
    extended-log: enum
    external: enum
  nested:
  - name: address-list
    mode: singleton
    fields:
      blocked-address: identifier-list
      blocked-log: enum
      severity: enum
      status: enum
      trusted-address: identifier-list
  - name: constraint
    mode: singleton
    nested:
    - name: content-length
      mode: singleton
      fields:
        action: enum
        length: integer
        log: enum
        severity: enum
        status: enum
    - name: exception
      mode: table
      key: <id>
      fields:
        address: string
        content-length: enum
        header-length: enum
        hostname: enum
        line-length: enum
        malformed: enum
        max-cookie: enum
        max-header-line: enum
        max-range-segment: enum
        max-url-param: enum
        method: enum
        param-length: enum
        pattern: string
        regex: enum
        url-param-length: enum
        version: enum
    - name: header-length
      mode: singleton
      fields:
        action: enum
        length: integer
        log: enum
        severity: enum
        status: enum
    - name: hostname
      mode: singleton
      fields:
        action: enum
        log: enum
        severity: enum
        status: enum
    - name: line-length
      mode: singleton
      fields:
        action: enum
        length: integer
        log: enum
        severity: enum
        status: enum
    - name: malformed
      mode: singleton
      fields:
        action: enum
        log: enum
        severity: enum
        status: enum
    - name: max-cookie
      mode: singleton
      fields:
        action: enum
        log: enum
        max-cookie: integer
        severity: enum
        status: enum
    - name: max-header-line
      mode: singleton
      fields:
        action: enum
        log: enum
        max-header-line: integer
        severity: enum
        status: enum
    - name: max-range-segment
      mode: singleton
      fields:
        action: enum
        log: enum
        max-range-segment: integer
        severity: enum
        status: enum
    - name: max-url-param
      mode: singleton
      fields:
        action: enum
        log: enum
        max-url-param: integer
        severity: enum
        status: enum
    - name: method
      mode: singleton
      fields:
        action: enum
        log: enum
        severity: enum
        status: enum
    - name: param-length
      mode: singleton
      fields:
        action: enum
        length: integer
        log: enum
        severity: enum
        status: enum
    - name: url-param-length
      mode: singleton
      fields:
        action: enum
        length: integer
        log: enum
        severity: enum
        status: enum
    - name: version
      mode: singleton
      fields:
        action: enum
        log: enum
        severity: enum
        status: enum
  - name: method
    mode: singleton
    fields:
      default-allowed-methods: option-list
      log: enum
      severity: enum
      status: enum
    nested:
    - name: method-policy
      mode: table
      key: <id>
      fields:
        address: string
        allowed-methods: option-list
        pattern: string
        regex: enum
  - name: signature
    mode: singleton
    fields:
      credit-card-detection-threshold: integer
      disabled-signature: identifier-list
      disabled-sub-class: identifier-list
    nested:
    - name: custom-signature
      mode: table
      key: <name>
      fields:
        action: enum
        case-sensitivity: enum
        direction: enum
        log: enum
        pattern: string
        severity: enum
        status: enum
        target: option-list
    - name: main-class
      mode: table
      key: <id>
      fields:
        action: enum
        log: enum
        severity: enum
        status: enum
  - name: url-access
    mode: table
    key: <id>
    fields:
      action: enum
      address: string
      log: enum
      severity: enum
    nested:
    - name: access-pattern
      mode: table
      key: <id>
      fields:
        negate: enum
        pattern: string
        regex: enum
        srcaddr: string
  read_only: true
- path: waf signature
  mode: table
  key: <id>
  fields:
    desc: string
- path: waf sub-class
  mode: table
  key: <id>
  fields:
    name: string
