    trap-v2c-lport: integer
    trap-v2c-rport: integer
    trap-v2c-status: enum
    vdoms: identifier-list
  nested:
  - name: hosts
    mode: table
    key: <id>
    fields:
      ha-direct: enum
      host-type: enum
      ip: opaque-user
      source-ip: ipv4-address
  - name: hosts6
    mode: table
    key: <id>
    fields:
      ha-direct: enum
      host-type: enum
      ipv6: ipv6-prefix
      source-ipv6: ipv6-address
