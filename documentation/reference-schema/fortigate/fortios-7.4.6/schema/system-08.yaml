domain: system
part: 8
parts: 8
sections:
- path: system snmp community
  mode: table
  key: <id>
  fields:
    events: option-list
    mib-view: string
    name: string
    query-v1-port: integer
    query-v1-status: enum
    query-v2c-port: integer
    query-v2c-status: enum
    status: enum
    trap-v1-lport: integer
    trap-v1-rport: integer
