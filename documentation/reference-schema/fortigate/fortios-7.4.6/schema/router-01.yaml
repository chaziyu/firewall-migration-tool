      description: Router ID.
      address_family: ipv4
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: router-id
    scan-time:
      source_type: integer
      fortios_type: integer
      description: Background scanner interval (sec), 0 to disable it.
      range:
        min: 5
        max: 60
      default:
        value: 60
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: scan-time
    synchronization:
      source_type: enum
      fortios_type: option
      description: Enable/disable only advertise routes from iBGP if routes present in an IGP.
      options:
      - value: enable
        description: Enable setting.
      - value: disable
        description: Disable setting.
      default:
        value: disable
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: synchronization
    tag-resolve-mode:
      source_type: enum
      fortios_type: option
      description: Configure tag-match mode. Resolves BGP routes with other routes containing the same tag.
      options:
      - value: disable
        description: Disable tag-match mode.
      - value: preferred
        description: Use tag-match if a BGP route resolution with another route containing the same tag is successful.
      - value: merge
        description: Merge tag-match with best-match when they use different routes.
      default:
        value: disable
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: tag-resolve-mode
