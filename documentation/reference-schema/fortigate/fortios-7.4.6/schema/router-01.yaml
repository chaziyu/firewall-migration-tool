    multipath-recursive-distance: enum
    network-import-check:
      source_type: enum
      fortios_type: option
      description: Enable/disable ensure BGP network route exists in IGP.
      options:
      - value: enable
        description: Enable setting.
      - value: disable
        description: Disable setting.
      default:
        value: enable
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: network-import-check
    recursive-inherit-priority: enum
