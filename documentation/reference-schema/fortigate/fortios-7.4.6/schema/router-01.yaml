          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: ibgp-multipath
    ignore-optional-capability: enum
    keepalive-timer:
      source_type: integer
      fortios_type: integer
      description: Frequency to send keep alive requests.
      range:
        min: 0
        max: 65535
      default:
        value: 60
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: keepalive-timer
