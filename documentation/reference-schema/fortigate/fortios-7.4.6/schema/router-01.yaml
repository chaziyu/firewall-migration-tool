domain: router
part: 1
parts: 3
sections:
- path: router access-list
  mode: table
  key: <name>
  fields:
    comments: string
  nested:
  - name: rule
    mode: table
    key: <id>
    fields:
      action: enum
      exact-match: enum
      prefix: opaque-user
      wildcard: opaque-user
- path: router access-list6
  mode: table
  key: <name>
  fields:
    comments: string
  nested:
  - name: rule
    mode: table
    key: <id>
    fields:
      action: enum
      exact-match: enum
      flags: integer
      prefix6: opaque-user
- path: router aspath-list
  mode: table
  key: <name>
  nested:
  - name: rule
    mode: table
    key: <id>
    fields:
      action: enum
      regexp: string
- path: router auth-path
  mode: table
  key: <name>
  fields:
    device: string
    gateway: ipv4-address
- path: router bfd
  mode: singleton
  nested:
  - name: multihop-template
    mode: table
    key: <id>
    fields:
      auth-mode: enum
      bfd-desired-min-tx: integer
      bfd-detect-mult: integer
      bfd-required-min-rx: integer
      dst: ipv4-classnet
      md5-key: password!sensitive
      src: ipv4-classnet
  - name: neighbor
    mode: table
    key: <ip>
    fields:
      interface: string
- path: router bfd6
  mode: singleton
  nested:
  - name: multihop-template
    mode: table
    key: <id>
    fields:
      auth-mode: enum
      bfd-desired-min-tx: integer
      bfd-detect-mult: integer
      bfd-required-min-rx: integer
      dst: ipv6-network
      md5-key: password!sensitive
      src: ipv6-network
  - name: neighbor
    mode: table
    key: <ip6-address>
    fields:
      interface: string
- path: router bgp
  mode: singleton
  fields:
    additional-path:
      source_type: enum
      fortios_type: option
      description: Enable/disable selection of BGP IPv4 additional paths.
      options:
      - value: enable
        description: Enable setting.
      - value: disable
        description: Disable setting.
      default:
        value: disable
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: additional-path
    additional-path-select:
      source_type: integer
      fortios_type: integer
      description: Number of additional paths to be selected for each IPv4 NLRI.
      range:
        min: 2
        max: 255
      default:
        value: 2
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: additional-path-select
    additional-path-select-vpnv4: integer
    additional-path-select-vpnv6: integer
    additional-path-select6: integer
    additional-path-vpnv4: enum
    additional-path-vpnv6: enum
    additional-path6: enum
    always-compare-med: enum
    as:
      source_type: opaque-user
      fortios_type: user
      description: Router AS number, asplain/asdot/asdot+ format, 0 to disable BGP.
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: as
    bestpath-as-path-ignore: enum
    bestpath-cmp-confed-aspath: enum
    bestpath-cmp-routerid: enum
    bestpath-med-confed: enum
    bestpath-med-missing-as-worst: enum
    client-to-client-reflection: enum
    cluster-id:
      source_type: ipv4-address-any
      fortios_type: ipv4-address-any
      description: Route reflector cluster ID.
      address_family: ipv4
      default:
        value: 0.0.0.0
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: cluster-id
    confederation-identifier: integer
    confederation-peers: identifier-list
    cross-family-conditional-adv: enum
    dampening: enum
    dampening-max-suppress-time: integer
    dampening-reachability-half-life: integer
    dampening-reuse: integer
    dampening-route-map:
      source_type: string
      fortios_type: string
      description: Criteria for dampening.
      length:
        max: 35
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: dampening-route-map
      semantic:
        reference:
          kind: route_map
          target_paths:
          - router route-map
          cardinality: one
        evidence:
          status: project_semantic
          source:
            document: FortiOS 7.4.6 CLI Reference
            config_path: router bgp
            parameter: dampening-route-map
            note: Fortinet documents this field as a route map; the concrete target config path is a project classification.
    dampening-suppress: integer
    dampening-unreachability-half-life: integer
    default-local-preference:
      source_type: integer
      fortios_type: integer
      description: Default local preference.
      range:
        min: 0
        max: 4294967295
      default:
        value: 100
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: default-local-preference
    deterministic-med: enum
    distance-external:
      source_type: integer
      fortios_type: integer
      description: Distance for routes external to the AS.
      range:
        min: 1
        max: 255
      default:
        value: 20
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: distance-external
    distance-internal:
      source_type: integer
      fortios_type: integer
      description: Distance for routes internal to the AS.
      range:
        min: 1
        max: 255
      default:
        value: 200
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: distance-internal
    distance-local:
      source_type: integer
      fortios_type: integer
      description: Distance for routes local to the AS.
      range:
        min: 1
        max: 255
      default:
        value: 200
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: distance-local
    ebgp-multipath:
      source_type: enum
      fortios_type: option
      description: Enable/disable EBGP multi-path.
      options:
      - value: enable
        description: Enable setting.
      - value: disable
        description: Disable setting.
      default:
        value: disable
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: ebgp-multipath
    enforce-first-as: enum
    fast-external-failover: enum
    graceful-end-on-timer: enum
    graceful-restart:
      source_type: enum
      fortios_type: option
      description: Enable/disable BGP graceful restart capabilities.
      options:
      - value: enable
        description: Enable setting.
      - value: disable
        description: Disable setting.
      default:
        value: disable
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: graceful-restart
    graceful-restart-time:
      source_type: integer
      fortios_type: integer
      description: Time needed for neighbors to restart (sec).
      range:
        min: 1
        max: 3600
      default:
        value: 120
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: graceful-restart-time
    graceful-stalepath-time:
      source_type: integer
      fortios_type: integer
      description: Time to hold stale paths of restarting neighbor (sec).
      range:
        min: 1
        max: 3600
      default:
        value: 360
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: graceful-stalepath-time
    graceful-update-delay:
      source_type: integer
      fortios_type: integer
      description: Route advertisement/selection delay after restart (sec).
      range:
        min: 1
        max: 3600
      default:
        value: 120
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: graceful-update-delay
    holdtime-timer:
      source_type: integer
      fortios_type: integer
      description: Number of seconds to mark peer as dead.
      range:
        min: 3
        max: 65535
      default:
        value: 180
      evidence:
        status: documented
        source:
          document: FortiOS 7.4.6 CLI Reference
          document_id: 01-746-912654-20241212
          config_path: router bgp
          parameter: holdtime-timer
    ibgp-multipath:
      source_type: enum
      fortios_type: option
      description: Enable/disable IBGP multi-path.
      options:
      - value: enable
        description: Enable setting.
      - value: disable
        description: Disable setting.
      default:
        value: disable
      evidence:
        status: documented
        source:
