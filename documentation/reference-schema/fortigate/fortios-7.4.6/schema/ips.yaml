domain: ips
part: 1
parts: 1
sections:
- path: ips custom
  mode: table
  key: <tag>
  fields:
    action: enum
    application: opaque-user
    comment: string
    location: opaque-user
    log: enum
    log-packet: enum
    os: opaque-user
    protocol: opaque-user
    rule-id: integer
    severity: opaque-user
    signature: var-string
    status: enum
- path: ips decoder
  mode: table
  key: <name>
  nested:
  - name: parameter
    mode: table
    key: <name>
    fields:
      value: string
  read_only: true
- path: ips global
  mode: singleton
  fields:
    anomaly-mode: enum
    av-mem-limit: integer
    cp-accel-mode: enum
    database: enum
    deep-app-insp-db-limit: integer
    deep-app-insp-timeout: integer
    engine-count: integer
    exclude-signatures: enum
    fail-open: enum
    ips-reserve-cpu: enum
    ngfw-max-scan-range: integer
    np-accel-mode: enum
    packet-log-queue-depth: integer
    session-limit-mode: enum
    socket-size: integer
    sync-session-ttl: enum
    traffic-submit: enum
  nested:
  - name: tls-active-probe
    mode: singleton
    fields:
      interface: string
      interface-select-method: enum
      source-ip: ipv4-address
      source-ip6: ipv6-address
      vdom: string
  model_dependent: true
- path: ips rule-settings
  mode: table
  key: <id>
  read_only: true
- path: ips rule
  mode: table
  key: <name>
  fields:
    action: enum
    application: opaque-user
    date: integer
    group: string
    location: opaque-user
    log: enum
    log-packet: enum
    os: opaque-user
    rev: integer
    rule-id: integer
    service: opaque-user
    severity: opaque-user
  nested:
  - name: metadata
    mode: table
    key: <id>
    fields:
      metaid: integer
      valueid: integer
  read_only: true
- path: ips sensor
  mode: table
  key: <name>
  fields:
    block-malicious-url: enum
    comment: var-string
    extended-log: enum
    replacemsg-group: string
    scan-botnet-connections: enum
  nested:
  - name: entries
    mode: table
    key: <id>
    fields:
      action: enum
      application: opaque-user
      cve: identifier-list
      default-action: enum
      default-status: enum
      last-modified: opaque-user
      location: opaque-user
      log: enum
      log-attack-context: enum
      log-packet: enum
      os: opaque-user
      protocol: opaque-user
      quarantine: enum
      quarantine-expiry: opaque-user
      quarantine-log: enum
      rate-count: integer
      rate-duration: integer
      rate-mode: enum
      rate-track: enum
      rule: identifier-list
      severity: opaque-user
      status: enum
      vuln-type: identifier-list
    nested:
    - name: exempt-ip
      mode: table
      key: <id>
      fields:
        dst-ip: ipv4-classnet
        src-ip: ipv4-classnet
