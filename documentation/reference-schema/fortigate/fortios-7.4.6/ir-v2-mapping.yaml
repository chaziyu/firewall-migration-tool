schema_version: 1
vendor: Fortinet
product: FortiOS
fortios_version: 7.4.6
ir_contract: documentation/ir-schema-v2-plan.md
current_mapping_reference: documentation/vendor-mapping/fortigate.md
purpose: >
  Planned semantic bridge from verified FortiOS source concepts to IR V2.
  This file does not make current implementation-support claims. Source fields not listed here
  remain source evidence or FortiOS extension data until their semantics are explicitly verified.
default_disposition: UNCLASSIFIED
rules:
  - canonical mapping requires portable semantics proven by the IR V2 contract
  - vendor-only attributes remain FortiOS extensions/source evidence
  - unknown or ambiguous semantics must not be widened to any/allow/default values
  - a section may have a canonical core and retain additional FortiOS extension fields

mappings:
  - sections: [firewall address, firewall address6]
    concept: address
    ir_v2: IRAddress
    classification: GENERIC_PLUS_EXT
    fields:
      subnet: subnet
      start-ip: range_start
      end-ip: range_end
      fqdn: fqdn
      associated-interface: interface
      macaddr: mac
      country: geo_code
    extension_examples: [EMS/FSSO/SDN/fabric metadata, FortiOS tagging details]

  - sections: [firewall addrgrp, firewall addrgrp6]
    concept: address_group
    ir_v2: IRAddressGroup
    classification: GENERIC_PLUS_EXT
    fields:
      member: members
      exclude-member: exclude_members
    extension_examples: [FortiOS dynamic/exclusion behavior, fabric metadata]

  - sections: [firewall service custom]
    concept: service
    ir_v2: IRService
    classification: GENERIC_PLUS_EXT
    field_semantics: protocol/source-port/destination-port/ICMP fields require semantic transformation
    extension_examples: [service aging, synchronization, vendor-only flags]

  - sections: [firewall service group]
    concept: service_group
    ir_v2: IRServiceGroup
    classification: GENERIC_PLUS_EXT
    fields:
      member: members

  - sections: [firewall schedule onetime, firewall schedule recurring]
    concept: schedule
    ir_v2: IRSchedule
    classification: GENERIC_PLUS_EXT
    mapping_status: planned_v2

  - sections: [firewall schedule group]
    concept: schedule_group
    ir_v2: IRScheduleGroup
    classification: GENERIC_PLUS_EXT
    fields:
      member: members
    mapping_status: planned_v2

  - sections: [system interface]
    concept: interface
    ir_v2: IRInterface
    classification: GENERIC_PLUS_EXT
    field_semantics: IP addressing, VLAN/aggregate membership, management access, and interface type require semantic transformation

  - sections: [system zone]
    concept: zone
    ir_v2: IRZone
    classification: GENERIC_PLUS_EXT
    field_semantics: interface membership is canonical; FortiOS intrazone/tagging behavior remains source/vendor evidence where not portable

  - sections: [firewall policy]
    concept: security_policy
    ir_v2: IRSecurityPolicy
    legacy_alias: IRPolicy
    classification: GENERIC_PLUS_EXT
    fields:
      srcintf: from_interfaces
      dstintf: to_interfaces
      srcaddr: source
      dstaddr: destination
      service: services
      action: action
      schedule: schedule
    extension_examples: [match_vip, ASIC/NPU details, policy-mode behavior, FortiOS-only rule options]

  - sections: [firewall profile-group]
    concept: security_profile_group
    ir_v2: IRSecurityProfileGroup
    classification: GENERIC_PLUS_EXT
    mapping_status: planned_v2

  - sections: [firewall vip, firewall vip6]
    concept: published_service
    ir_v2: IRPublishedService
    legacy_alias: IRVirtualIP
    classification: GENERIC_PLUS_EXT
    field_semantics: >
      extip/mappedip and external/mapped ports provide the portable published-service core.
      Load balancing, persistence, GSLB, QUIC, HTTP multiplex, TLS details, ARP/NDP, and NAT46/NAT64 source semantics
      stay in the FortiOS extension unless explicitly portable.
    extension_examples: [nat-source-vip, port-mapping type, GSLB, QUIC, HTTP2/HTTP3, SSL cipher details, ARP/NDP behavior]

  - sections: [firewall vipgrp, firewall vipgrp6]
    concept: published_service_group
    ir_v2: IRPublishedServiceGroup
    legacy_alias: IRVirtualIPGroup
    classification: GENERIC_PLUS_EXT
    fields:
      member: members
    mapping_status: planned_v2

  - sections: [firewall ippool, firewall ippool6]
    concept: nat_pool
    ir_v2: IRNATPool
    legacy_alias: IRIPPool
    classification: GENERIC_PLUS_EXT
    field_semantics: address ranges, port ranges, and associated interface form the portable core
    extension_examples: [PBA/CGN controls, session quotas, NAT46/NAT64 route controls, utilization alarms, ARP behavior]

  - sections: [firewall central-snat-map]
    concept: nat_rule
    ir_v2: IRNATRule
    classification: GENERIC_PLUS_EXT
    note: central/manual placement is provenance/rulebase placement, not a canonical NAT translation type
    extension_examples: [FortiOS ordering, VIP references, fixed-port/source-policy evidence]

  - sections: [router static, router static6]
    concept: static_route
    ir_v2: IRRoute
    classification: GENERIC_PLUS_EXT
    field_semantics: destination, gateway, device, distance, priority, and routing-instance context map semantically

  - sections: [router policy, router policy6]
    concept: policy_route
    ir_v2: IRPolicyRoute
    classification: GENERIC
    mapping_status: planned_v2
    note: FortiOS-specific TOS/Internet-Service/source-port behavior must remain extension evidence if not represented canonically

  - sections: [system vdom]
    concept: virtual_firewall_context
    ir_v2: IRVirtualFirewallContext
    classification: GENERIC_PLUS_EXT
    mapping_status: planned_v2
    extension_examples: [FortiOS VDOM mode, central NAT, NGFW mode, opmode]

  - sections: [system ha]
    concept: high_availability
    ir_v2: IRHighAvailability
    classification: GENERIC_PLUS_EXT
    mapping_status: planned_v2

  - sections: [vpn ipsec phase1-interface, vpn ipsec phase1, vpn ipsec phase2-interface, vpn ipsec phase2]
    concept: site_to_site_vpn
    ir_v2: IRVPNTunnel
    classification: GENERIC_PLUS_EXT
    note: phase1/phase2 relationships and unresolved references must be preserved explicitly

  - sections: [vpn ssl settings]
    concept: remote_access_vpn
    ir_v2: IRRemoteAccessVPN
    classification: GENERIC_PLUS_EXT
    mapping_status: planned_v2
    extension_examples: [FortiOS portal/bookmark/web-mode/FortiClient behavior]

  - sections: [authentication scheme]
    concept: authentication_profile
    ir_v2: IRAuthenticationProfile
    legacy_alias: IRAuthenticationScheme
    classification: GENERIC_PLUS_EXT
    mapping_status: planned_v2

  - sections: [authentication rule]
    concept: authentication_policy
    ir_v2: IRAuthenticationPolicy
    legacy_alias: IRAuthenticationRule
    classification: GENERIC_PLUS_EXT
    mapping_status: planned_v2

  - sections: [user ldap, user radius, user tacacs+]
    concept: identity_source
    ir_v2: IRIdentitySource
    classification: GENERIC_PLUS_EXT
    mapping_status: planned_v2
    note: credentials are presence-only in canonical IR and must remain redacted

  - sections: [endpoint-control fctems, endpoint-control fctems-override]
    concept: endpoint_context_provider
    ir_v2: IREndpointContextProvider
    legacy_alias: IRZTNAProvider
    classification: GENERIC_PLUS_EXT
    mapping_status: planned_v2

  - sections: [firewall proxy-address]
    concept: proxy_request_match
    ir_v2: IRProxyRequestMatch
    legacy_alias: IRProxyAddress
    classification: GENERIC_PLUS_EXT
    mapping_status: planned_v2

  - sections: [web-proxy explicit]
    concept: web_proxy
    ir_v2: IRWebProxy
    classification: GENERIC_PLUS_EXT
    mapping_status: planned_v2
