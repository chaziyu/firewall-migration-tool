phase: 16
family: certificates-and-pki
nodes:
- id: certificate
  kind: list
  xpath: '{scope}/certificate'
  scope:
  - shared
  - device-group
  - vsys
  - template
  - device
  migration_relevance: migration_relevant
  evidence:
    status: repository_observed
    source:
      xpath: '{scope}/certificate'
      repository_path: src/fwmigrate/parsers/palo_alto/certificates.py
  entry_key: name
  fields:
    subject:
      xml: subject
      type: string
    issuer:
      xml: issuer
      type: string
    common_name:
      xml: common-name
      type: string
    expiry_epoch:
      xml: expiry-epoch
      type: integer
    not_valid_before:
      xml: not-valid-before
      type: string
    ca:
      xml: ca
      type: boolean
    private_key:
      xml: private-key
      type: secret
      sensitive: true
    certificate:
      xml: certificate
      type: secret
      migration_relevance: source_evidence_only
      sensitive: true
  custom_handler: true
  sensitive: true
- id: certificate-profile
  kind: list
  xpath: '{scope}/certificate-profile'
  scope:
  - shared
  - device-group
  - vsys
  - template
  - device
  migration_relevance: migration_relevant
  evidence:
    status: repository_observed
    source:
      xpath: '{scope}/certificate-profile'
      repository_path: src/fwmigrate/parsers/palo_alto/certificates.py
  entry_key: name
  fields:
    ca_certificates:
      xml: ca-certificates/entry
      type: entry-list
      cardinality: list
      custom_handler: true
    username_field:
      xml: username-field
      type: xml-subtree
      custom_handler: true
    use_crl:
      xml: use-crl
      type: boolean
    use_ocsp:
      xml: use-ocsp
      type: boolean
    block_unknown_cert:
      xml: block-unknown-cert
      type: boolean
  custom_handler: true
- id: ssl-tls-service-profile
  kind: list
  xpath: '{scope}/ssl-tls-service-profile'
  scope:
  - shared
  - template
  - device
  migration_relevance: migration_relevant
  evidence:
    status: repository_observed
    source:
      xpath: '{scope}/ssl-tls-service-profile'
      repository_path: src/fwmigrate/parsers/palo_alto/certificates.py
  entry_key: name
  fields:
    certificate:
      xml: certificate
      type: string
      reference:
        kinds:
        - certificate
        cardinality: one
    protocol_settings:
      xml: protocol-settings
      type: xml-subtree
      custom_handler: true
  custom_handler: true
- id: ocsp-responder
  kind: list
  xpath: '{scope}/ocsp-responder'
  scope:
  - shared
  - template
  - device
  migration_relevance: migration_relevant
  evidence:
    status: repository_observed
    source:
      xpath: '{scope}/ocsp-responder'
      repository_path: src/fwmigrate/parsers/palo_alto/certificates.py
  entry_key: name
  fields:
    host_name:
      xml: host-name
      type: string
    certificate:
      xml: certificate
      type: string
      reference:
        kinds:
        - certificate
        cardinality: one
