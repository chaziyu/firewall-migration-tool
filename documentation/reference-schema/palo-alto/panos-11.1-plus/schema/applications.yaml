    status: repository_observed
    source:
      xpath: '{scope}/application-filter'
      repository_path: src/fwmigrate/parsers/palo_alto/completeness.py
  entry_key: name
  fields:
    category:
      xml: category/member
      type: member-list
      cardinality: list
    subcategory:
      xml: subcategory/member
      type: member-list
      cardinality: list
    technology:
      xml: technology/member
      type: member-list
      cardinality: list
    risk:
      xml: risk/member
      type: member-list
