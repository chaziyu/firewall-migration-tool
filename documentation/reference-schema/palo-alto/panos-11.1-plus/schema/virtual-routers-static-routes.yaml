phase: 8
family: virtual-routers-and-static-routes
nodes:
- id: virtual-router
  kind: list
  xpath: '{network-scope}/network/virtual-router'
  scope:
  - template
  - template-stack
  - device
  - vsys
  migration_relevance: migration_relevant
  evidence:
    status: repository_observed
    source:
      xpath: '{network-scope}/network/virtual-router'
      repository_path: src/fwmigrate/parsers/palo_alto/routing.py
  entry_key: name
  fields:
    interfaces:
      xml: interface/member
      type: member-list
      cardinality: list
      reference:
        kinds:
        - interface
        cardinality: many
        scope_resolution: device/template
    admin_dist:
      xml: admin-dists
      type: xml-subtree
      migration_relevance: source_evidence_only
- id: static-route-ipv4
  kind: list
  xpath: '{network-scope}/network/virtual-router/entry/routing-table/ip/static-route'
  scope:
  - template
  - template-stack
  - device
  - vsys
  migration_relevance: migration_relevant
  evidence:
    status: repository_observed
    source:
      xpath: '{network-scope}/network/virtual-router/entry/routing-table/ip/static-route'
      repository_path: src/fwmigrate/parsers/palo_alto/routing.py
  entry_key: name
  fields:
    destination:
      xml: destination
      type: cidr
    interface:
      xml: interface
      type: string
      reference:
        kinds:
        - interface
        cardinality: one
    metric:
      xml: metric
      type: integer
    route_table:
      xml: route-table
      type: enum
    next_hop:
      xml: nexthop/*
      type: xml-subtree
      custom_handler: true
    bfd_profile:
      xml: bfd/profile
      type: string
      migration_relevance: source_evidence_only
    path_monitor:
      xml: path-monitor
      type: xml-subtree
      migration_relevance: source_evidence_only
  custom_handler: true
- id: static-route-ipv6
  kind: list
  xpath: '{network-scope}/network/virtual-router/entry/routing-table/ipv6/static-route'
  scope:
  - template
  - template-stack
  - device
  - vsys
  migration_relevance: migration_relevant
  evidence:
    status: repository_observed
    source:
      xpath: '{network-scope}/network/virtual-router/entry/routing-table/ipv6/static-route'
      repository_path: src/fwmigrate/parsers/palo_alto/routing.py
  entry_key: name
  fields:
    destination:
      xml: destination
      type: cidr
    interface:
      xml: interface
      type: string
      reference:
        kinds:
        - interface
        cardinality: one
    metric:
      xml: metric
      type: integer
    next_hop:
      xml: nexthop/*
      type: xml-subtree
      custom_handler: true
  custom_handler: true
