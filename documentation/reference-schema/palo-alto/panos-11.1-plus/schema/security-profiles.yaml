phase: 14
family: security-profiles
subphases:
- 14A antivirus
- 14B anti-spyware
- 14C vulnerability
- 14D URL filtering
- 14E file blocking
- 14F WildFire analysis
- 14G data filtering
- 14H DNS security
- 14I advanced/SaaS needs review
nodes:
- id: antivirus-profile
  kind: list
  xpath: '{scope}/profiles/virus'
  scope: &id001
  - shared
  - device-group
  - vsys
  migration_relevance: migration_relevant
  evidence:
    status: repository_observed
    source:
      xpath: '{scope}/profiles/virus'
      repository_path: src/fwmigrate/parsers/palo_alto/security_profiles.py
  entry_key: name
  fields: &id002
    description:
      xml: description
      type: string
    rules:
      xml: rules/entry
      type: entry-list
      cardinality: list
      custom_handler: true
    exceptions:
      xml: exception/entry
      type: entry-list
      cardinality: list
      custom_handler: true
  custom_handler: true
