phase: 1
family: address-objects
nodes:
- id: address
  kind: list
  xpath: '{scope}/address'
  scope:
  - shared
  - device-group
  - vsys
  migration_relevance: migration_relevant
  evidence:
    status: repository_observed
    source:
      xpath: '{scope}/address/entry'
      repository_path: src/fwmigrate/parsers/palo_alto/transformer.py
      note: The current transformer accepts exactly one non-empty ip-netmask, ip-range, ip-wildcard, or fqdn child.
  entry_key: name
  fields:
    ip_netmask:
      xml: ip-netmask
      type: ip-or-cidr
      description: IPv4/IPv6 host or prefix.
    ip_range:
      xml: ip-range
      type: ip-range
    ip_wildcard:
      xml: ip-wildcard
      type: string
      description: IPv4 wildcard-mask address form retained by the current transformer.
    fqdn:
      xml: fqdn
      type: fqdn
    description:
      xml: description
      type: string
    tags:
      xml: tag/member
      type: member-list
      cardinality: list
      reference:
        kinds: [tag]
        cardinality: many
        scope_resolution: current->ancestors->shared
  custom_handler: true
