phase: 25
purpose: Consistency checks required before the schema is used by a future registry.
checks:
- id: yaml-parse
  severity: error
  rule: Every YAML file must parse.
- id: node-id-unique
  severity: error
  rule: Node id must be unique within a schema family; globally duplicated ids require explicit variants.
- id: xpath-present
  severity: error
  rule: Every source node has a non-empty XPath/template XPath.
- id: xpath-parent-child
  severity: error
  rule: Nested field XML paths must be relative to their owning node.
- id: entry-key
  severity: error
  rule: List/rulebase nodes declare entry identity.
- id: reference-target
  severity: warning
  rule: Reference kinds must resolve to a declared node kind or a documented predefined namespace.
- id: scope
  severity: error
  rule: Every node declares supported scope kinds.
- id: inheritance
  severity: warning
  rule: Inheritance-bearing nodes declare resolution direction/override behavior.
- id: sensitive
  severity: error
  rule: Secrets/private keys/passwords/shared secrets are marked sensitive.
- id: migration-classification
  severity: error
  rule: Every node has a migration relevance classification.
- id: evidence
  severity: error
  rule: Every node has evidence status and source.
- id: order
  severity: warning
  rule: Policy/rulebase and template-stack list order is retained.
- id: unknown-xml
  severity: error
  rule: Unknown runtime XML can be retained as source evidence instead of becoming an automatic parse error.
coverage_targets:
  phase_files: 27
  critical_scope_kinds:
  - shared
  - device-group
  - vsys
  - template
  - template-stack
  - device
  critical_rule_positions:
  - pre-rulebase
  - rulebase
  - post-rulebase
  - default
  critical_reference_namespaces:
  - address
  - service
  - application
  - schedule
  - tag
  - security-profile
  - certificate
  - interface
  - zone
current_status:
  yaml_parse: to-be-validated-in-this-change
  duplicate_xpaths: review required for intentional scope templates
  version_specific_reference: needs_review entries remain until the intended uploaded Palo Alto reference is available
