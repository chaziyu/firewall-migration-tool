[package]
name = "firewall-migration-tool-desktop"
version = "0.2.1"
description = "Tauri desktop shell for Firewall Migration Tool"
edition = "2021"

[lib]
name = "firewall_migration_tool_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.11.0"
uuid = { version = "1", features = ["v4"] }
