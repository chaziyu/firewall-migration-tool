[package]
name = "firewall-migration-tool-desktop"
version = "0.2.0"
description = "Tauri desktop shell for Firewall Migration Tool"
edition = "2021"

[lib]
name = "firewall_migration_tool_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
