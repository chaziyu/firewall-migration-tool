{% macro icon(name, class_name='') -%}
<svg
  class="icon {{ class_name }}"
  width="20"
  height="20"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.7"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  {% if name == 'shield' %}
  <path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6Z" />
  <path d="m8.5 12 2.5 2.5 4.5-5" />
  {% elif name == 'switch' %}
  <path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4 4-4-4 4-4" />
  {% elif name == 'table' %}
  <rect x="3" y="3" width="18" height="18" rx="3" />
  <path d="M3 9h18M9 9v12M3 15h18" />
  {% elif name == 'activity' %}
  <path d="M2 12h5l3-8 4 16 3-8h5" />
  {% elif name == 'arrow' %}
  <path d="M4 12h16m-6-6 6 6-6 6" />
  {% elif name == 'chevron' %}
  <path d="m9 5 7 7-7 7" />
  {% elif name == 'plus' %}
  <path d="M12 5v14M5 12h14" />
  {% elif name == 'upload' %}
  <path d="M12 16V3m-5 5 5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4" />
  {% elif name == 'download' %}
  <path d="M12 3v13m-5-5 5 5 5-5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
  {% elif name == 'file' %}
  <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z" />
  <path d="M14 3v6h6M8 13h8M8 17h5" />
  {% elif name == 'layers' %}
  <path d="m12 3 10 5-10 5L2 8Zm-10 9 10 5 10-5M2 17l10 5 10-5" />
  {% elif name == 'code' %}
  <path d="m7 7-5 5 5 5m10-10 5 5-5 5M14 4l-4 16" />
  {% elif name == 'network' %}
  <rect x="8" y="2" width="8" height="6" rx="1" />
  <rect x="2" y="16" width="7" height="6" rx="1" />
  <rect x="15" y="16" width="7" height="6" rx="1" />
  <path d="M12 8v4M5.5 16v-4h13v4" />
  {% elif name == 'book' %}
  <path
    d="M12 5v16M12 5C8 2 4 3 2 4v15c3-1 6-1 10 2 4-3 7-3 10-2V4c-2-1-6-2-10 1Z"
  />
  {% elif name == 'check' %}
  <path d="m5 12 4 4L19 6" />
  {% elif name == 'close' %}
  <path d="m6 6 12 12M6 18 18 6" />
  {% elif name == 'lock' %}
  <rect x="4" y="10" width="16" height="11" rx="2" />
  <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
  {% elif name == 'info' %}
  <circle cx="12" cy="12" r="9" />
  <path d="M12 11v6m0-10h.01" />
  {% elif name == 'terminal' %}
  <rect x="2" y="3" width="20" height="18" rx="3" />
  <path d="m6 8 4 4-4 4m8 0h4" />
  {% endif %}
</svg>
{%- endmacro %}
