                set name "Credit-Card-Filter"
                set severity high
                set proto smtp pop3 imap http-get http-post mapi
                set filter-by sensor
                set sensor "def-cc-sensor"
                set action log-only
            next
            edit 2
                set name "Credit-Card-Filter"
                set severity high
                set type message
                set proto smtp pop3 imap http-post mapi
                set filter-by sensor
                set sensor "def-cc-sensor"
                set action log-only
            next
        end
    next
    edit "SSN-Sensor"
