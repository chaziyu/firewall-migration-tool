                set action log-only
            next
            edit 3
                set name "SSN-Sensor-Filter"
                set severity high
                set proto smtp pop3 imap http-get http-post ftp mapi
                set filter-by sensor
                set sensor "def-ssn-sensor"
                set action log-only
            next
        end
    next
