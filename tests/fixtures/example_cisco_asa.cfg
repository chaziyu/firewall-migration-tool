ASA Version 9.16(2)
!
hostname ASA-Core-DC
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 198.51.100.1 255.255.255.0
!
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 10.0.1.1 255.255.255.0
!
interface GigabitEthernet0/2
 nameif dmz
 security-level 50
 ip address 172.16.10.1 255.255.255.0
!
object network Web_Server_01
 host 172.16.10.80
 description Production Web Server
object network App_Server_Subnet
 subnet 10.0.1.0 255.255.255.0
object network DB_Range
 range 192.168.10.100 192.168.10.200
object network API_External_FQDN
 fqdn v4 api.external.com
!
object-group network Grp_DC_Servers
 network-object object Web_Server_01
 network-object object App_Server_Subnet
 network-object object DB_Range
!
object-group service Grp_Web_Services tcp
 port-object eq 80
 port-object eq 443
!
access-list inside_in extended permit tcp object-group Grp_DC_Servers any object-group Grp_Web_Services
access-list outside_in extended permit tcp any object Web_Server_01 eq 443
access-list inside_in extended deny ip any any
!
access-group inside_in in interface inside
access-group outside_in in interface outside
!
nat (inside,outside) source static Web_Server_01 198.51.100.5
nat (inside,outside) after-auto source dynamic any interface
!
route outside 0.0.0.0 0.0.0.0 198.51.100.254 1
route inside 10.0.0.0 255.0.0.0 10.0.1.1 1
!
