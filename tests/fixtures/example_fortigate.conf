# FortiOS Configuration Backup Example
config system global
    set hostname "FortiGate-500E"
    set admin-sport 443
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 192.168.1.99 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
    next
    edit "port2"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.0
        set allowaccess ping
        set type physical
        set role wan
    next
    edit "port3"
        set vdom "root"
        set ip 10.1.1.1 255.255.255.0
        set allowaccess ping
        set type physical
        set role dmz
    next
end

config firewall address
    edit "HOST_10.1.1.100"
        set type ipmask
        set subnet 10.1.1.100 255.255.255.255
        set comment "Web Server DMZ"
    next
    edit "NET_192.168.1.0_24"
        set type ipmask
        set subnet 192.168.1.0 255.255.255.0
        set comment "Corporate LAN"
    next
    edit "RANGE_10.1.1.200-250"
        set type iprange
        set start-ip 10.1.1.200
        set end-ip 10.1.1.250
        set comment "Staging Servers"
    next
    edit "FQDN_update.microsoft.com"
        set type fqdn
        set fqdn "update.microsoft.com"
        set comment "Windows Update"
    next
end

config firewall addrgrp
    edit "GRP_Internal_Networks"
        set member "HOST_10.1.1.100" "NET_192.168.1.0_24"
        set comment "All internal corporate subnets"
    next
end

config firewall service custom
    edit "TCP_8080"
        set tcp-portrange 8080
        set comment "Custom Web Proxy"
    next
    edit "UDP_5000"
        set udp-portrange 5000
        set comment "Internal Streaming"
    next
end

config firewall service group
    edit "GRP_Web_Services"
        set member "HTTP" "HTTPS" "TCP_8080"
        set comment "Standard Web Group"
    next
end

config firewall ippool
    edit "POOL_NAT_OUT"
        set startip 203.0.113.10
        set endip 203.0.113.20
        set comments "Outbound SNAT Pool"
    next
end

config firewall vip
    edit "VIP_Web_Server"
        set extip 203.0.113.5
        set mappedip 10.1.1.100
        set extintf "port2"
        set portforward enable
        set extport 443
        set mappedport 443
        set comment "Inbound HTTPS to DMZ Web"
    next
end

config firewall policy
    edit 1
        set name "Allow_Corporate_To_Internet"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "NET_192.168.1.0_24"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set nat enable
        set comments "LAN users internet outbound"
    next
    edit 2
        set name "Allow_Inbound_Web_VIP"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "VIP_Web_Server"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set av-profile "default"
        set ips-sensor "protect_server"
        set comments "Inbound traffic to web server"
    next
    edit 3
        set name "Deny_Guest_To_DMZ"
        set srcintf "port1"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "HOST_10.1.1.100"
        set action deny
        set schedule "always"
        set service "ALL"
        set comments "Block guest access to DMZ"
    next
end

config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 203.0.113.1
        set device "port2"
        set distance 10
        set comment "Default Gateway"
    next
end
