config ips sensor
    edit "ips"
        config entries
            edit 1
                set action block
            next
        end
    next
end
config antivirus profile
    edit "av"
        set comment "test"
        set external-blocklist "av-one"
        config http
            set archive-block "exe"
            set archive-log "enable"
        end
    next
end
config webfilter profile
    edit "web"
        set comment "test"
        set options "block-invalid-url"
        config ftgd-wf
            set options "web-one"
            config filters
                edit "1"
                    set category 1
                    set auth-usr-grp "itsec"
                next
            end
        end
    next
end
config dnsfilter profile
    edit "dns"
        set comment "test"
        set external-ip-blocklist "dns-one"
        config ftgd-dns
            set options "dns-one"
        end
    next
end
config application list
    edit "apps"
        set comment "test"
        set options "app-one"
        config entries
            edit "entry-one"
                set application 16091
                set category 15 16
                set exclusion 21
                set risk 3
                set popularity 2
            next
        end
    next
end
config dlp sensor
    edit "dlp"
        set comment "test"
    next
end
config firewall ssl-ssh-profile
    edit "ssl"
        set comment "test"
        set server-cert "cert-one"
        config https
            set ports 443
        end
    next
end
