#config-version=FGVM-7.4.8-FW-build0000
config system interface
    edit "lan"
        set ip 10.10.10.1 255.255.255.0
        set role lan
    next
    edit "dmz"
        set ip 172.16.50.1 255.255.255.0
        set role dmz
    next
    edit "wan1"
        set mode dhcp
        set role wan
    next
    edit "VPN_HQ"
        set type tunnel
        set interface "wan1"
    next
end
config vpn ipsec phase1-interface
    edit "VPN_HQ"
        set interface "wan1"
        set remote-gw 203.0.113.1
    next
end
config firewall address
    edit "NET_USERS"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "NET_SERVERS"
        set subnet 10.10.20.0 255.255.255.0
    next
    edit "RANGE_FINANCE"
        set type iprange
        set start-ip 10.10.20.100
        set end-ip 10.10.20.104
    next
    edit "NET_GUEST"
        set subnet 10.10.30.0 255.255.255.0
    next
    edit "NET_VOICE"
        set subnet 10.10.40.0 255.255.255.0
    next
    edit "NET_DMZ"
        set subnet 172.16.50.0 255.255.255.0
    next
    edit "NET_HQ"
        set subnet 10.20.0.0 255.255.0.0
    next
end
config firewall ippool
    edit "POOL_FINANCE"
        set type one-to-one
        set startip 198.51.100.30
        set endip 198.51.100.34
    next
    edit "POOL_GENERAL"
        set type overload
        set startip 198.51.100.20
        set endip 198.51.100.20
    next
    edit "POOL_VOICE"
        set type fixed-port-range
        set startip 198.51.100.40
        set endip 198.51.100.43
        set source-startip 10.10.40.0
        set source-endip 10.10.40.255
    next
    edit "POOL_PBA_LAB"
        set type port-block-allocation
        set startip 198.51.100.50
        set endip 198.51.100.51
        set block-size 128
        set num-blocks-per-user 8
    next
    edit "POOL_UNUSED"
        set startip 198.51.100.60
        set endip 198.51.100.60
    next
end
config firewall vip
    edit "VIP_WEB_HTTPS"
        set extintf "wan1"
        set extip 198.51.100.100
        set mappedip "172.16.50.10"
        set portforward enable
        set protocol tcp
        set extport 443
        set mappedport 443
    next
    edit "VIP_WEB_HTTPS_DUP"
        set extintf "wan1"
        set extip 198.51.100.100
        set mappedip "172.16.50.99"
        set portforward enable
        set protocol tcp
        set extport 443
        set mappedport 443
    next
    edit "VIP_ADMIN_RISKY"
        set extintf "any"
        set extip 198.51.100.101
        set mappedip "172.16.50.11"
        set portforward enable
        set protocol tcp
        set extport 2222
        set mappedport 22
    next
    edit "VIP_MAIL"
        set extintf "wan1"
        set extip 198.51.100.102
        set mappedip "172.16.50.12"
        set portforward enable
        set protocol tcp
        set extport 25
        set mappedport 25
    next
    edit "VIP_DNS"
        set extintf "wan1"
        set extip 198.51.100.103
        set mappedip "172.16.50.13"
        set portforward enable
        set protocol udp
        set extport 53
        set mappedport 5353
    next
    edit "VIP_APP"
        set extintf "wan1"
        set extip 198.51.100.104
        set mappedip "172.16.50.14"
        set portforward enable
        set protocol tcp
        set extport 8443
        set mappedport 443
    next
end
config firewall vipgrp
    edit "PUBLIC_APPS"
        set interface "wan1"
        set member "VIP_DNS" "VIP_APP"
    next
end
