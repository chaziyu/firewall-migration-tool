#config-version=FGT60F-7.4.6-FW-build2577-240918:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set ip 192.0.2.1 255.255.255.0
        set role lan
        set future-interface-field kept
    next
    edit "port2"
        set ip 198.51.100.1 255.255.255.0
        set role wan
    next
end
config system zone
    edit "inside"
        set interface "port1"
    next
end
config firewall address
    edit "address-one"
        set subnet 10.0.0.1 255.255.255.255
        set cache-ttl invalid
        set future-field kept
    next
end
config firewall addrgrp
    edit "address-group-one"
        set member "address-one"
    next
end
config firewall service custom
    edit "service-one"
        set tcp-portrange 443
        set future-service-field kept
    next
end
config firewall service group
    edit "service-group-one"
        set member "service-one"
    next
end
config firewall vip
    edit "vip-one"
        set extip 198.51.100.10
        set mappedip "10.0.0.10"
    next
end
config firewall vipgrp
    edit "vip-group-one"
        set member "vip-one"
    next
end
config firewall ippool
    edit "pool-one"
        set startip 203.0.113.10
        set endip 203.0.113.20
    next
end
config firewall central-snat-map
    edit 1
        set srcintf "port1"
        set dstintf "port2"
        set orig-addr "address-one"
        set dst-addr "all"
        set nat-ippool "pool-one"
    next
end
config firewall policy
    edit 1
        set name "allow-web"
        set srcintf "inside"
        set dstintf "port2"
        set srcaddr "address-group-one"
        set dstaddr "all"
        set service "service-group-one"
        set action accept
    next
end
config router static
    edit 1
        set dst 203.0.113.0 255.255.255.0
        set gateway 198.51.100.254
        set device "port2"
        set future-route-field kept
    next
end
