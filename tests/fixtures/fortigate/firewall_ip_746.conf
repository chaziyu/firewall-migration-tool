# config-version = 7.4.6
config firewall ippool
    edit "POOL746"
        set add-nat64-route enable
        set arp-intf "wan1"
        set arp-reply disable
        set associated-interface "wan1"
        set block-size 4096
        set cgn-block-size 64
        set cgn-client-endip 192.0.2.20
        set cgn-client-ipv6shift 127
        set cgn-client-startip 192.0.2.10
        set cgn-fixedalloc enable
        set cgn-overload enable
        set cgn-port-end 65535
        set cgn-port-start 1024
        set cgn-spa enable
        set comments "FortiOS 7.4.6 IP pool"
        set endip 203.0.113.20
        set endport 65533
        set exclude-ip 203.0.113.11
        set nat64 enable
        set num-blocks-per-user 128
        set pba-interim-log 86400
        set pba-timeout 86400
        set permit-any-host enable
        set port-per-user 60417
        set source-endip 10.0.0.20
        set source-startip 10.0.0.10
        set startip 203.0.113.10
        set startport 5117
        set subnet-broadcast-in-ippool enable
        set type overload
        set utilization-alarm-clear 40
        set utilization-alarm-raise 50
    next
end
config firewall ippool6
    edit "POOL6"
        set add-nat46-route enable
        set comments "IPv6 pool"
        set endip 2001:db8::20
        set nat46 enable
        set startip 2001:db8::10
    next
end
config firewall ipv6-eh-filter
    set auth enable
    set dest-opt disable
    set fragment enable
    set hdopt-type 0 1 255
    set hop-opt disable
    set no-next enable
    set routing enable
    set routing-type 255
    set future-setting abc
end
