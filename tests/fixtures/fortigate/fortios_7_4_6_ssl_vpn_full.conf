config vpn ssl settings
    set status enable
    set ssl-min-proto-ver tls1-2
    set ssl-max-proto-ver tls1-3
    set dtls-min-proto-ver dtls1-0
    set dtls-max-proto-ver dtls1-2
    set dtls-heartbeat-interval 5
    set auth-session-check-source-ip disable
    set source-interface "wan1"
    set source-address "SSLVPN_SOURCE"
    set source-address6 "SSLVPN_SOURCE6"
    set tunnel-ip-pools "SSLVPN_POOL"
    set tunnel-ipv6-pools "SSLVPN_POOL6"
    set deflate-compression-level 7
    set login-timeout 120
    set future-safe-option enabled
    unset dns-suffix
    config authentication-rule
        edit 1
            set auth local
            set source-interface "wan1"
            set source-address "AUTH_SOURCE"
            set portal "full-access"
        next
        edit 2
            set auth ldap
            set source-interface "wan2"
            set source-address6 "AUTH_SOURCE6"
            set portal "restricted-access"
        next
    end
end

config vpn ssl web portal
    edit "full-access"
        set tunnel-mode enable
        set ipv6-tunnel-mode enable
        set ip-pools "SSLVPN_POOL"
        set ipv6-pools "SSLVPN_POOL6"
        set split-tunneling enable
        set ipv6-split-tunneling enable
        set ipv6-split-tunneling-routing-address "V6_ROUTE"
        set default-window-width 1280
        set default-window-height 720
        set unknown-safe-setting enabled
        unset heading
        config split-dns
            edit 1
                set domains "corp.example"
                set dns-server1 10.0.0.2
                set ipv6-dns-server1 2001:db8::2
            next
        end
        config mac-addr-check-rule
            edit 1
                set mac-addr "00:11:22:33:44:55"
                set action allow
            next
        end
        config os-check-list
            edit 1
                set action allow
                set os-type windows
            next
        end
        config bookmark-group
            edit "internal"
                config bookmarks
                    edit "rdp"
                        set apptype rdp
                        set host "10.0.0.10"
                        set logon-password "ssl-vpn-secret-must-not-survive"
                        config form-data
                            edit "sensitive"
                                set value "ssl-vpn-secret-must-not-survive"
                            next
                        end
                    next
                    edit "ssh"
                        set apptype ssh
                        set url "ssh://10.0.0.11"
                    next
                end
            next
        end
        config landing-page
            edit "welcome"
                set heading "Welcome"
                config form-data
                    edit "theme"
                        set value "dark"
                    next
                end
            next
        end
    next
    edit "restricted-access"
        set tunnel-mode disable
        set web-mode enable
    next
end
