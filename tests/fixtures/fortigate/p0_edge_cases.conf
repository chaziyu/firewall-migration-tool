# config-version = 7.4.6
# Synthetic sanitized fail-closed fixture. Invalid/unknown values are intentional.
config system settings
    set central-nat enable
    set ngfw-mode profile-based
    set opmode nat
end

config system interface
    edit "edge-lan"
        set vdom "root"
        set ip 10.20.0.1 255.255.255.0
        set type physical
        set role lan
    next
    edit "edge-wan"
        set vdom "root"
        set ip 198.51.100.50 255.255.255.0
        set type physical
        set role wan
    next
end

config firewall address
    edit "EDGE_SRC"
        set type ipmask
        set subnet 10.20.0.0 255.255.255.0
        set cache-ttl invalid
        set future-address-field kept
    next
    edit "EDGE_DST"
        set type ipmask
        set subnet 192.0.2.0 255.255.255.0
    next
end

config firewall addrgrp
    edit "EDGE_GROUP"
        set member "EDGE_SRC"
        append member "EDGE_DST"
        unset member
        set member "EDGE_DST"
    next
end

config firewall service custom
    edit "EDGE_SERVICE"
        set tcp-portrange 443
        set protocol-number invalid
        set future-service-field kept
    next
end

config firewall ippool
    edit "EDGE_POOL"
        set startip 198.51.100.200
        set endip 198.51.100.210
        set type overload
    next
end

config firewall central-snat-map
    edit 1
        set srcintf "edge-lan"
        set dstintf "edge-wan"
        set orig-addr "EDGE_SRC"
        set dst-addr "EDGE_DST"
        set nat enable
        set nat-ippool "EDGE_POOL"
        set status enable
        set type ipv4
    next
end

config firewall ip-translation
    edit 1
        set startip 192.0.2.10
        set endip 192.0.2.20
        set map-startip 198.51.100.20
        set type SCTP
    next
end

config firewall policy
    edit 100
        set name "BROKEN_REFERENCE"
        set srcintf "edge-lan"
        set dstintf "edge-wan"
        set srcaddr "EDGE_SRC"
        set dstaddr "MISSING_ADDRESS"
        set action accept
        set schedule "always"
        set service "EDGE_SERVICE"
        set comments "Intentional unresolved dependency"
    next
end
