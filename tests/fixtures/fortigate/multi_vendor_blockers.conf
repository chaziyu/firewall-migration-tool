config vdom
    edit root
        config firewall address
            edit "shared-name"
                set subnet 10.0.0.1 255.255.255.255
            next
        end
        config firewall addrgrp
            edit "cycle-a"
                set member "cycle-b"
            next
            edit "cycle-b"
                set member "cycle-a"
            next
            edit "missing-member"
                set member "not-present"
            next
        end
        config firewall service custom
            edit "sctp-only"
                set protocol SCTP
                set sctp-portrange 2905
            next
        end
        config firewall service group
            edit "service-cycle-a"
                set member "service-cycle-b"
            next
            edit "service-cycle-b"
                set member "service-cycle-a"
            next
        end
        config firewall policy
            edit 30
                set name "unknown-reference"
                set srcintf "missing-interface"
                set dstintf "wan"
                set srcaddr "missing-address"
                set dstaddr "all"
                set service "sctp-only"
                set action accept
                set status enable
                set unrecognized-match "preserve-source"
                future-command preserve-this
            next
            edit 40
                set name "inspection-policy"
                set srcintf "lan"
                set dstintf "wan"
                set srcaddr "all"
                set dstaddr "all"
                set service "ALL"
                set schedule "always"
                set action accept
                set status enable
                set utm-status enable
                set inspection-mode proxy
                set profile-group "deep-inspection"
            next
            edit 50
                set name "source-fields-omitted"
                set srcintf "lan"
                set dstintf "wan"
            next
        end
        config firewall ippool
            edit "overload-pool"
                set type overload
                set startip 198.51.100.20
                set endip 198.51.100.21
                set arp-reply enable
            next
        end
        config firewall central-snat-map
            edit 1
                set srcintf "lan"
                set dstintf "wan"
                set orig-addr "all"
                set dst-addr "all"
                set nat-ippool "overload-pool"
                set status enable
            next
        end
        config firewall vip
            edit "web-port-forward"
                set extip 203.0.113.80
                set extintf "wan"
                set mappedip "10.20.0.80"
                set portforward enable
                set protocol tcp
                set extport 8443
                set mappedport 443
            next
        end
        config system sdwan
            set status enable
            config members
                edit 1
                    set interface "wan"
                    set gateway 203.0.113.1
                next
            end
        end
        config router policy
            edit 1
                set input-device "lan"
                set src 10.10.0.0/24
                set dst 198.51.100.0/24
                set gateway 203.0.113.1
                set output-device "wan"
                set status enable
            next
        end
        config router static
            edit 70
                set dst 192.0.2.0 255.255.255.0
                set device "lan"
            next
        end
        config firewall policy
            edit 60
                set name "unsupported-traffic-rule"
                set srcintf "lan"
                set dstintf "wan"
                set srcaddr "all"
                set dstaddr "all"
                set service "ALL"
                set schedule "always"
                set action accept
                set status enable
                set nat enable
                set ippool enable
                set poolname "overload-pool"
            next
        end
    next
    edit tenant-a
        config firewall address
            edit "shared-name"
                set subnet 192.0.2.1 255.255.255.255
            next
        end
    next
end
