config vdom
    edit root
        config system interface
            edit "lan"
                set type physical
                set mode static
                set ip 10.10.0.1 255.255.255.0
                set status up
            next
            edit "wan"
                set type physical
                set mode static
                set ip 203.0.113.2 255.255.255.0
                set status up
            next
            edit "app-vlan"
                set type vlan
                set interface "lan"
                set vlanid 120
                set mode static
                set status up
                set ip 10.20.0.1 255.255.255.0
            next
        end

        config system zone
            edit "inside"
                set interface "lan" "app-vlan"
                set intrazone deny
            next
            edit "outside"
                set interface "wan"
            next
        end

        config firewall address
            edit "client-net"
                set type ipmask
                set subnet 10.10.0.0 255.255.255.0
            next
            edit "app-host"
                set type ipmask
                set subnet 10.10.0.10 255.255.255.255
                set comment "opaque-sensitive-comment"
            next
            edit "client-range"
                set type iprange
                set start-ip 10.10.0.20
                set end-ip 10.10.0.30
            next
            edit "future-address"
                set type ipmask
                set subnet 10.20.0.11 255.255.255.255
                set future-address-setting "retained-evidence"
            next
        end

        config firewall addrgrp
            edit "trusted-clients"
                set member "client-net"
            next
        end

        config firewall service custom
            edit "tcp-app"
                set tcp-portrange 8443
            next
            edit "udp-dns"
                set udp-portrange 53
            next
        end

        config firewall service group
            edit "application-services"
                set member "tcp-app" "udp-dns"
            next
        end

        config firewall schedule recurring
            edit "weekday-hours"
                set day monday tuesday wednesday thursday friday
                set start 09:00
                set end 17:00
            next
        end

        config firewall schedule onetime
            edit "change-window"
                set start "2026/12/24 09:00"
                set end "2026/12/24 11:00"
            next
        end

        config firewall policy
            edit 10
                set name "allow-app"
                set srcintf "inside"
                set dstintf "outside"
                set srcaddr "trusted-clients"
                set dstaddr "app-host"
                set service "application-services"
                set schedule "weekday-hours"
                set action accept
                set status enable
                set nat disable
                set utm-status disable
                set srcaddr-negate disable
                set dstaddr-negate disable
                set service-negate disable
                set logtraffic all
            next
            edit 20
                set name "deny-other"
                set srcintf "inside"
                set dstintf "outside"
                set srcaddr "all"
                set dstaddr "all"
                set service "ALL"
                set schedule "always"
                set action deny
                set status enable
                set nat disable
                set utm-status disable
                set srcaddr-negate disable
                set dstaddr-negate disable
                set service-negate disable
                set logtraffic all
            next
        end

        config router static
            edit 1
                set dst 0.0.0.0 0.0.0.0
                set gateway 203.0.113.1
                set device "wan"
                set distance 10
            next
            edit 2
                set dst 10.30.0.0 255.255.0.0
                set gateway 10.10.0.254
                set device "lan"
                set distance 20
            next
        end
    next
end
