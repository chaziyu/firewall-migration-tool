config user ldap
    edit "ldap"
        set server "ldap.example.test"
    next
end
config user radius
    edit "radius"
        set server "radius.example.test"
    next
end
config user tacacs+
    edit "tacacs"
        set server "tacacs.example.test"
    next
end
config user saml
    edit "saml"
        set entity-id "https://example.test/saml"
    next
end
config user fsso
    edit "fsso"
        set server "10.0.0.1"
    next
end
config user fsso-polling
    edit "polling"
        set status enable
    next
end
config user adgrp
    edit "ad-users"
        set server-name "fsso"
    next
end
config user local
    edit "local"
        set status enable
        set passwd-time 1720000000
    next
end
config user group
    edit "users"
        set member "local"
        config match
            edit 1
                set server-name "ldap"
                set group-name "Users"
            next
        end
    next
end
