# config-version = 7.4.6
# Synthetic sanitized regression fixture based on the FortiOS 7.4.6 CLI reference.
config system global
    set hostname "P0-FortiGate"
end

config system settings
    set central-nat disable
    set ngfw-mode profile-based
    set opmode nat
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 10.10.0.1 255.255.255.0
        set allowaccess ping
        set type physical
        set role lan
    next
    edit "port2"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.0
        set allowaccess ping
        set type physical
        set role wan
    next
    edit "vlan100"
        set vdom "root"
        set ip 10.10.100.1 255.255.255.0
        set type vlan
        set interface "port1"
        set vlanid 100
        set role lan
    next
end

config system zone
    edit "LAN_ZONE"
        set interface "vlan100"
        set intrazone allow
    next
end

config firewall address
    edit "USER_NET"
        set type ipmask
        set subnet 10.10.100.0 255.255.255.0
        set comment "Synthetic user subnet"
    next
    edit "WEB_SERVER"
        set type ipmask
        set subnet 10.10.100.10 255.255.255.255
        set comment "Synthetic web server"
    next
end

config firewall address6
    edit "V6_NET"
        set type ipprefix
        set ip6 2001:db8:100::/64
        set comment "Synthetic IPv6 subnet"
    next
end

config firewall addrgrp
    edit "INTERNAL_NETS"
        set member "USER_NET"
        set comment "Synthetic IPv4 address group"
    next
end

config firewall addrgrp6
    edit "V6_GROUP"
        set member "V6_NET"
        set comment "Synthetic IPv6 address group"
    next
end

config firewall service custom
    edit "TCP_443"
        set tcp-portrange 443
        set comment "Synthetic HTTPS service"
    next
    edit "TCP_8443"
        set tcp-portrange 8443
        set comment "Synthetic alternate HTTPS service"
    next
end

config firewall service group
    edit "WEB_SERVICES"
        set member "TCP_443" "TCP_8443"
        set comment "Synthetic web service group"
    next
end

config firewall schedule recurring
    edit "WORK_HOURS"
        set day monday tuesday wednesday thursday friday
        set start 08:00
        set end 18:00
    next
end

config firewall schedule onetime
    edit "MAINT_WINDOW"
        set start 01:00 2026/10/01
        set end 03:00 2026/10/01
    next
end

config firewall schedule group
    edit "BUSINESS_SCHEDULES"
        set member "WORK_HOURS" "MAINT_WINDOW"
    next
end

config firewall ippool
    edit "SNAT_POOL"
        set startip 198.51.100.100
        set endip 198.51.100.110
        set type overload
        set comments "Synthetic IPv4 SNAT pool"
    next
end

config firewall ippool6
    edit "SNAT6_POOL"
        set startip 2001:db8:ffff::100
        set endip 2001:db8:ffff::110
        set comments "Synthetic IPv6 SNAT pool"
    next
end

config firewall vip
    edit "VIP_WEB"
        set extip 198.51.100.10
        set mappedip 10.10.100.10
        set extintf "port2"
        set portforward enable
        set protocol tcp
        set extport 8443
        set mappedport 443
        set comment "Synthetic inbound VIP"
    next
end

config firewall vipgrp
    edit "VIP_SERVERS"
        set interface "port2"
        set member "VIP_WEB"
        set comments "Synthetic VIP group"
    next
end

config firewall policy
    edit 10
        set name "OUTBOUND_WEB"
        set srcintf "LAN_ZONE"
        set dstintf "port2"
        set srcaddr "INTERNAL_NETS"
        set dstaddr "all"
        set action accept
        set schedule "BUSINESS_SCHEDULES"
        set service "WEB_SERVICES"
        set nat enable
        set ippool enable
        set poolname "SNAT_POOL"
        set comments "Synthetic outbound policy"
    next
    edit 20
        set name "INBOUND_WEB"
        set srcintf "port2"
        set dstintf "LAN_ZONE"
        set srcaddr "all"
        set dstaddr "VIP_SERVERS"
        set action accept
        set schedule "always"
        set service "TCP_8443"
        set comments "Synthetic inbound policy"
    next
end

config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 198.51.100.1
        set device "port2"
        set distance 10
        set comment "Synthetic default route"
    next
end
