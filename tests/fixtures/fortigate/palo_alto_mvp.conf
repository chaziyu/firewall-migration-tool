config system interface
    edit "lan"
        set ip 10.0.0.1 255.255.255.0
        set alias "LAN"
    next
    edit "wan"
        set ip 192.0.2.2 255.255.255.0
        set alias "WAN"
    next
end

config system zone
    edit "trust"
        set interface "lan"
    next
    edit "untrust"
        set interface "wan"
    next
end

config firewall address
    edit "web-host"
        set type fqdn
        set fqdn web.example.test
    next
end

config firewall addrgrp
    edit "web-servers"
        set member "web-host"
    next
end

config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
    next
end

config firewall schedule recurring
    edit "work-hours"
        set day monday tuesday wednesday thursday friday
        set start 08:00
        set end 17:00
    next
end

config firewall schedule onetime
    edit "holiday"
        set start "2026/12/25 00:00"
        set end "2026/12/26 00:00"
    next
end

config firewall policy
    edit 10
        set name "allow-web"
        set srcintf "lan"
        set dstintf "wan"
        set srcaddr "web-host"
        set dstaddr "web-host"
        set service "HTTPS"
        set schedule "work-hours"
        set action accept
        set srcaddr-negate enable
        set comments "Allow web access"
    next
end

config firewall vip
    edit "web-vip"
        set extip 198.51.100.10
        set mappedip "10.0.0.10"
        set extintf "wan"
    next
end
