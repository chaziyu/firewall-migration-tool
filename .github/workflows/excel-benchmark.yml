name: Excel export benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[reports]"
      - run: python scripts/benchmark_excel_export.py --scenario small --scenario policies-10k --scenario mixed > excel-benchmark.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: excel-benchmark
          path: excel-benchmark.jsonl
