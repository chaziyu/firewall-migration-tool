name: Snyk Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    # Enable only after approving source/analysis transfer to Snyk. PR code never
    # executes in a job with this service token, including same-repository PRs.
    if: vars.SNYK_ENABLED == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Check approved service credentials
        run: test -n "$SNYK_TOKEN"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependency set for scanning
        run: |
          python -m pip install --constraint requirements/constraints-python312.txt -e ".[collection,deployment]"
          python -m pip check
          npm ci --prefix src/frontend
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
      - name: Snyk Code test
        id: code
        shell: bash
        run: |
          set +e
          snyk code test --sarif-file-output=snyk-code.sarif
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # 1 means findings; other nonzero statuses are scanner failures.
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Upload generated code SARIF even on scan failure
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
      - name: Snyk dependency test
        id: dependencies
        shell: bash
        run: |
          set +e
          snyk test --all-projects
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Snyk IaC test
        id: iac
        shell: bash
        run: |
          set +e
          snyk iac test
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Build container for scanning
        run: docker build -t firewall-migration-tool:snyk .
      - name: Snyk container test
        id: container
        shell: bash
        run: |
          set +e
          snyk container test firewall-migration-tool:snyk --file=Dockerfile
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Fail on vulnerability findings
        if: always() && (steps.code.outputs.status == '1' || steps.dependencies.outputs.status == '1' || steps.iac.outputs.status == '1' || steps.container.outputs.status == '1')
        run: |
          echo "Snyk reported vulnerabilities; review the scan results."
          exit 1
