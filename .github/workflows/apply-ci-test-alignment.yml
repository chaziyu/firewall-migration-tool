name: Apply CI test alignment

on:
  push:
    paths:
      - .github/workflows/apply-ci-test-alignment.yml

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Align stale Excel assertions with readability contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_block_closer(text: str, anchor: str, old_start: str, new_start: str) -> str:
              anchor_pos = text.index(anchor)
              start = text.index(old_start, anchor_pos)
              text = text[:start] + new_start + text[start + len(old_start):]
              close = text.index("    ]\n", start + len(new_start))
              return text[:close] + "    }\n" + text[close + len("    ]\n"):]

          excel_path = Path("tests/test_excel_exporter.py")
          excel = excel_path.read_text()

          old = '''    assert workbook["Address Groups"]["C4"].value == "Users\\nRemote Users"\n    assert workbook["Address Groups"]["B4"].value == "address-group-uuid"\n'''
          new = '''    address_groups = workbook["Address Groups"]\n    address_group_headers = {cell.value: cell.column for cell in address_groups[3]}\n    assert address_groups.cell(4, address_group_headers["Members"]).value == "Users\\nRemote Users"\n    assert address_groups.cell(4, address_group_headers["Source UUID"]).value == "address-group-uuid"\n'''
          assert excel.count(old) == 1
          excel = excel.replace(old, new, 1)

          excel = replace_block_closer(
              excel,
              "def test_excel_exporter_exposes_source_policy_audit_fields():",
              "    assert [cell.value for cell in policies[3]] == [\n",
              "    assert {cell.value for cell in policies[3]} == {\n",
          )

          old = '''    assert grp_sheet["A4"].value == "DELEUM/ENTERPRISE KEY ADMINS"\n    assert grp_sheet["C4"].value == "DELEUM/KEY ADMINS"\n'''
          new = '''    assert grp_sheet["A4"].value == "DELEUM/ENTERPRISE KEY ADMINS"\n    grp_headers = {cell.value: cell.column for cell in grp_sheet[3]}\n    assert grp_sheet.cell(4, grp_headers["Members"]).value == "DELEUM/KEY ADMINS"\n'''
          assert excel.count(old) == 1
          excel = excel.replace(old, new, 1)
          excel_path.write_text(excel)

          addresses_path = Path("tests/test_fortigate_addresses.py")
          addresses = addresses_path.read_text()
          addresses = replace_block_closer(
              addresses,
              "def test_fortigate_address_excel_exposes_source_metadata():",
              "    assert list(headers) == [\n",
              "    assert set(headers) == {\n",
          )
          addresses_path.write_text(addresses)

          # This workflow is a one-shot patch mechanism; remove it in the same commit.
          Path(".github/workflows/apply-ci-test-alignment.yml").unlink()
          PY

      - name: Commit aligned tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_excel_exporter.py tests/test_fortigate_addresses.py .github/workflows/apply-ci-test-alignment.yml
          git commit -m "test(excel): align assertions with readability layout"
          git push origin HEAD:main
