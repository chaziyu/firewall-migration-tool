name: CI Regression Finalizer

on:
  push:
    branches:
      - fix/ci-regressions-2026-09-07

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply corrected repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ci-regression-repair-v2.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('repair v2 Python block not found')
          block = workflow.split(marker, 1)[1].split('          PY\n', 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          exec(compile(script, 'ci-regression-repair-v2', 'exec'), {})

          # The v2 repair removed device_serial from standalone device scopes.
          # That fixed VSYS/interface lookup but also removed device provenance
          # from routing and management-access inventory. Keep the device scope
          # identity, while the separate root-level VSYS changes from v2 remain.
          parser = Path('src/fwmigrate/parsers/palo_alto/parser.py')
          text = parser.read_text(encoding='utf-8')
          patched = '''            dev_serial = (\n                dev_name\n                if dev_name in managed_names or (not managed_names and qualify_vsys)\n                else None\n            )\n            dev_scope = PANScope(\n                kind="device", name=dev_name, device_name=dev_name,\n                device_serial=dev_serial,\n            )\n'''
          original = '''            dev_scope = PANScope(kind="device", name=dev_name, device_name=dev_name,\n                                 device_serial=dev_name)\n'''
          if patched not in text:
              raise SystemExit('expected Palo Alto device-scope patch not found')
          parser.write_text(text.replace(patched, original, 1), encoding='utf-8')
          PY
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate remaining Palo Alto regressions
        run: |
          python -m pytest -q \
            tests/test_palo_alto_extraction_remediation.py::test_routing_instance_discovery_preserves_logical_router_vrf_hierarchy \
            tests/test_palo_alto_management_access.py::test_management_access_is_source_only_and_scope_aware \
            tests/test_palo_alto_interfaces.py::test_layer3_zone \
            tests/test_palo_alto_interfaces.py::test_zone_conflict_does_not_silently_overwrite
      - name: Validate full suite
        run: python -m pytest -q
      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git commit -m "fix: restore firewall parser CI contracts"
          git push origin HEAD:${{ github.ref_name }}
