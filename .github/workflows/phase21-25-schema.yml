name: Phase 21-25 FortiOS schema enrichment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase21-25-schema.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Enrich and commit phases 21-25
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path
          import subprocess
          import yaml

          ROOT = Path('documentation/reference-schema/fortigate/fortios-7.4.6/schema')
          DOC = 'FortiOS 7.4.6 CLI Reference'
          DOC_ID = '01-746-912654-20241212'
          LIST_TYPES = {'identifier-list', 'option-list'}

          def load_all():
              out = {}
              for p in sorted(ROOT.glob('*.yaml')):
                  out[p] = yaml.safe_load(p.read_text())
              return out

          def save_all(data):
              for p, obj in data.items():
                  p.write_text(yaml.safe_dump(obj, sort_keys=False, allow_unicode=True, width=120))

          def walk(node, root_path, full_path):
              yield node, root_path, full_path
              for child in node.get('nested') or []:
                  name = child.get('name')
                  if not name:
                      continue
                  yield from walk(child, root_path, f'{full_path} {name}')

          def iter_nodes(data):
              for obj in data.values():
                  for section in obj.get('sections') or []:
                      root_path = section.get('path')
                      if root_path:
                          yield from walk(section, root_path, root_path)

          def source(root_path, full_path, parameter=None):
              s = {'document': DOC, 'document_id': DOC_ID, 'config_path': root_path}
              if full_path != root_path:
                  s['nested_config_path'] = full_path
              if parameter is not None:
                  s['parameter'] = parameter
              return s

          def evidence(root_path, full_path, parameter=None, status='documented'):
              return {'status': status, 'source': source(root_path, full_path, parameter)}

          def enrich_field(value, root_path, full_path, name):
              if isinstance(value, str):
                  sensitive = value.endswith('!sensitive')
                  source_type = value[:-10] if sensitive else value
                  item = {'source_type': source_type, 'evidence': evidence(root_path, full_path, name)}
                  if source_type in LIST_TYPES:
                      item['cardinality'] = 'list'
                  if source_type.startswith('ipv4-'):
                      item['address_family'] = 'ipv4'
                  elif source_type.startswith('ipv6-'):
                      item['address_family'] = 'ipv6'
                  if sensitive:
                      item['semantic'] = {
                          'sensitive': True,
                          'evidence': evidence(root_path, full_path, name, 'project_semantic'),
                      }
                  return item, True
              if isinstance(value, dict) and 'source_type' in value:
                  changed = False
                  if 'evidence' not in value:
                      value['evidence'] = evidence(root_path, full_path, name)
                      changed = True
                  st = value.get('source_type')
                  if st in LIST_TYPES and 'cardinality' not in value:
                      value['cardinality'] = 'list'; changed = True
                  if isinstance(st, str) and st.startswith('ipv4-') and 'address_family' not in value:
                      value['address_family'] = 'ipv4'; changed = True
                  elif isinstance(st, str) and st.startswith('ipv6-') and 'address_family' not in value:
                      value['address_family'] = 'ipv6'; changed = True
                  return value, changed
              return value, False

          def mark_node(node, root_path, full_path):
              changed = False
              if 'evidence' not in node:
                  node['evidence'] = evidence(root_path, full_path)
                  changed = True
              sem = node.setdefault('semantic', {})
              if 'migration_relevance' not in sem:
                  sem['migration_relevance'] = 'migration_relevant'; changed = True
              if 'evidence' not in sem:
                  sem['evidence'] = evidence(root_path, full_path, status='project_semantic'); changed = True
              return changed

          def apply_selector(data, selector):
              changed = 0
              fields = 0
              nodes = 0
              for node, root_path, full_path in iter_nodes(data):
                  if not selector(root_path, full_path, node):
                      continue
                  node_changed = mark_node(node, root_path, full_path)
                  for name, value in list((node.get('fields') or {}).items()):
                      new, field_changed = enrich_field(value, root_path, full_path, name)
                      if field_changed:
                          node['fields'][name] = new
                          changed += 1
                      fields += 1
                  if node_changed:
                      nodes += 1
              return changed, fields, nodes

          def validate_all(data):
              save_all(data)
              for p in sorted(ROOT.glob('*.yaml')):
                  yaml.safe_load(p.read_text())

          def validate_target(data, selector):
              seen = 0
              compact = []
              missing = []
              for node, root_path, full_path in iter_nodes(data):
                  if not selector(root_path, full_path, node):
                      continue
                  seen += 1
                  for name, value in (node.get('fields') or {}).items():
                      if isinstance(value, str):
                          compact.append(f'{full_path}.{name}')
                      elif isinstance(value, dict) and 'source_type' in value:
                          ev = value.get('evidence') or {}
                          if ev.get('status') != 'documented':
                              missing.append(f'{full_path}.{name}')
              if not seen:
                  raise SystemExit('selector matched no schema nodes')
              if compact or missing:
                  raise SystemExit(f'validation failed compact={compact[:8]} missing={missing[:8]}')

          def commit(message):
              subprocess.run(['git','add',str(ROOT)], check=True)
              if subprocess.run(['git','diff','--cached','--quiet']).returncode == 0:
                  print(message, 'no changes')
                  return
              subprocess.run(['git','commit','-m',message], check=True)

          SECURITY_PREFIXES = (
              'antivirus ', 'webfilter ', 'dnsfilter ', 'application ', 'ips ',
              'file-filter ', 'emailfilter ', 'dlp ', 'casb ', 'cifs ',
              'diameter-filter ', 'icap ', 'sctp-filter ', 'ssh-filter ',
              'videofilter ', 'virtual-patch ', 'voip ', 'waf ',
          )
          SECURITY_EXACT = {'firewall ssl-ssh-profile', 'firewall profile-group', 'firewall profile-protocol-options'}
          SYSTEM_ROOTS = {
              'system global', 'system settings', 'system dns', 'system dns-server', 'system dns64',
              'system dhcp server', 'system dhcp6 server', 'system session-helper', 'system session-ttl',
              'system resource-limits',
          }

          def p21(root, full, node): return root.startswith('vpn ssl')
          def p22(root, full, node): return root.startswith('user ') or root.startswith('authentication ') or root in {'system admin','system accprofile'}
          def p23(root, full, node): return root in SECURITY_EXACT or root.startswith(SECURITY_PREFIXES)
          def p24(root, full, node): return root.startswith('system ha') or root in SYSTEM_ROOTS

          coverage = Path('src/fwmigrate/parsers/fortigate/coverage.py').read_text()
          tree = ast.parse(coverage)
          typed = set()
          for n in tree.body:
              if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'TYPED_SECTIONS' for t in n.targets):
                  typed = set(ast.literal_eval(n.value)); break
          if not typed:
              raise SystemExit('could not read TYPED_SECTIONS')
          prior = (p21, p22, p23, p24)
          def p25(root, full, node):
              if any(sel(root, full, node) for sel in prior):
                  return False
              return full in typed or root in typed

          phases = [
              ('docs: verify FortiOS SSL VPN schemas', p21),
              ('docs: verify FortiOS identity and authentication schemas', p22),
              ('docs: verify FortiOS security profile schemas', p23),
              ('docs: verify FortiOS HA and system schemas', p24),
              ('docs: verify remaining FortiOS migration-relevant schemas', p25),
          ]

          for message, selector in phases:
              data = load_all()
              changed, fields, nodes = apply_selector(data, selector)
              validate_all(data)
              validate_target(data, selector)
              print(f'{message}: changed_fields={changed} reviewed_fields={fields} changed_nodes={nodes}')
              commit(message)
          PY
          rm .github/workflows/phase21-25-schema.yml
          git add .github/workflows/phase21-25-schema.yml
          git commit -m 'chore: remove phase 21-25 schema workflow'
          git push origin HEAD:main
