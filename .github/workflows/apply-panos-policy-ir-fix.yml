name: Apply PAN-OS Policy IR Fix

on:
  push:
    branches:
      - fix/panos-policy-ir-lossless
    paths:
      - scripts/apply_panos_policy_ir_fix.py
      - scripts/fix_panos_policy_patch_import.py
      - scripts/fix_panos_policy_regressions.py
      - .github/workflows/apply-panos-policy-ir-fix.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply lossless PAN-OS policy patch
        run: |
          python scripts/apply_panos_policy_ir_fix.py
          python scripts/fix_panos_policy_patch_import.py
          python scripts/fix_panos_policy_regressions.py

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run focused regression matrix
        run: |
          python -m pytest -q \
            tests/test_palo_alto_policy_ir_lossless.py \
            tests/test_palo_alto_safety.py \
            tests/test_palo_alto_policies.py \
            tests/test_palo_alto_integrated_panorama.py \
            tests/test_ir_schema_version.py \
            tests/test_fortigate_generator_safety.py \
            tests/test_multi_vendor_matrix.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests documentation
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No implementation changes produced"
            exit 1
          fi
          git commit -m "fix(panos): preserve policy profile and action semantics"
          git push origin HEAD:fix/panos-policy-ir-lossless
