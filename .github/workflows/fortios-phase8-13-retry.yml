name: Retry FortiOS schema phases 8-13

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fortios-phase8-13-retry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run reviewed transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/fortios-phase8-13.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['apply']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Enrich remaining reviewed FortiOS families')
          Path('/tmp/apply-phases.sh').write_text(script, encoding='utf-8')
          subprocess.run(['bash', '/tmp/apply-phases.sh'], check=True)
          PY
      - name: Validate scoped changes
        run: |
          git diff --check
          python scripts/docs/validate_docs.py
          python scripts/docs/generate_docs.py --check
      - name: Commit schema phases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentation/reference-schema/fortigate/fortios-7.4.6/schema/firewall-01.yaml \
                  documentation/reference-schema/fortigate/fortios-7.4.6/schema/firewall-02.yaml \
                  documentation/reference-schema/fortigate/fortios-7.4.6/schema/firewall-03.yaml
          git diff --cached --quiet && { echo 'No schema changes produced'; exit 1; }
          git commit -m "docs: verify FortiOS policy and NAT schemas"
          git push origin HEAD:main
