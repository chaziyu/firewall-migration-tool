name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: python -m pytest -v

  fortigate-regression:
    name: FortiGate regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run FortiGate regression suite
        run: |
          python -m pytest \
            tests/test_parser.py \
            tests/test_fortigate_access_inventory.py \
            tests/test_fortigate_administrator_inventory.py \
            tests/test_fortigate_alignment.py \
            tests/test_fortigate_api.py \
            tests/test_fortigate_ip_pools.py \
            tests/test_fortigate_vips.py \
            tests/test_fortigate_nat_correlation.py \
            tests/test_fortigate_secret_leakage.py \
            tests/test_excel_exporter.py \
            -v
