name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile source and tests
        run: python -m compileall -q src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Import smoke test on supported Python
        run: python -c "import fwmigrate.web; import fwmigrate.conversion.fortigate_to_palo_alto.pipeline"
      - name: Run test suite
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  docker:
    needs: [lint, test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build container image
        run: docker build -t firewall-migration-tool:ci .
      - name: Smoke test container
        run: |
          set -euo pipefail
          container=firewall-migration-tool-ci
          username=fwmigrate-ci
          password="ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" --publish 5000:5000 \
            --env FWMIGRATE_WEB_USERNAME="$username" \
            --env FWMIGRATE_WEB_PASSWORD="$password" \
            firewall-migration-tool:ci
          for attempt in {1..60}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$container")
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then docker logs "$container"; exit 1; fi
            sleep 2
          done
          status=$(docker inspect --format='{{.State.Health.Status}}' "$container")
          if [ "$status" != healthy ]; then docker logs "$container"; exit 1; fi
          curl --fail --silent --show-error --user "$username:$password" http://127.0.0.1:5000/api/vendors
          asset=$(curl --fail --silent --show-error --user "$username:$password" http://127.0.0.1:5000/ | sed -n 's/.*src="\(\/assets\/[^" ]*\)".*/\1/p')
          test -n "$asset"
          curl --fail --silent --show-error --user "$username:$password" "http://127.0.0.1:5000$asset" >/dev/null


  desktop:
    needs: [lint, test, frontend]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install sidecar dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements/constraints-python312.txt -e ".[ai,collection,deployment]" "pyinstaller>=6.0"
          python -m pip check
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
      - name: Build Python sidecar
        run: python desktop/build_tauri_sidecar.py
      - name: Check Tauri desktop shell
        run: cargo check --manifest-path src/frontend/src-tauri/Cargo.toml
