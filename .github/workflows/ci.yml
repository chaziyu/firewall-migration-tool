name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "documentation/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "documentation/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile source, tests, and scripts
        run: python -m compileall -q src tests scripts
      - name: Lint Python
        run: ruff check src tests scripts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Import smoke test on supported Python
        run: python -c "import fwmigrate.web; import fwmigrate.conversion.fortigate_to_palo_alto.pipeline"
      - name: Run test suite
        run: python -m pytest -n auto -q

  release-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install release dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,collection]"
          python -m pip check
      - name: Run collection tests with collection extras
        run: python -m pytest tests/web/test_web_live_collection.py -n auto -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
