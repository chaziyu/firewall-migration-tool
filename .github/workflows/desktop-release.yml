name: Desktop release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate version, tag and public key
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_desktop_release_version.py --tag "$env:RELEASE_TAG"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install constrained sidecar and test dependencies
        run: |
          python -m pip install --constraint requirements/constraints-python312.txt -e ".[dev,collection,deployment]" "pyinstaller>=6.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Test Python
        run: python -m pytest -q
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Test frontend
        working-directory: src/frontend
        run: npm test
      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint
      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
      - name: Build existing Python sidecar
        run: python desktop/build_tauri_sidecar.py
      - name: Test desktop update source guard
        run: cargo test --locked --lib --manifest-path src/frontend/src-tauri/Cargo.toml
      - name: Build signed installers and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src/frontend
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.release.conf.json -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: Desktop ${{ github.ref_name }}
          releaseBody: Save your work before installing an update.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
