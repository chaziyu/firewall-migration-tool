name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate version and create missing release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python scripts/check_desktop_release_version.py)
          tag="desktop-v$version"
          python scripts/check_desktop_release_version.py --tag "$tag"
          if [ "$EVENT_NAME" != workflow_run ]; then
            test "$PUSH_TAG" = "$tag"
          elif git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Version already tagged; skipping release."
            exit 0
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
            gh workflow run desktop-release.yml --ref "$tag"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 60
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate version, tag and public key
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/check_desktop_release_version.py --tag "$env:RELEASE_TAG"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Install constrained sidecar and test dependencies
        run: |
          python -m pip install --constraint requirements/constraints-python312.txt -e ".[dev,collection,deployment]" "pyinstaller>=6.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Test Python
        run: python -m pytest -q
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Test frontend
        working-directory: src/frontend
        run: npm test
      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint
      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
      - name: Build existing Python sidecar
        run: python desktop/build_tauri_sidecar.py
      - name: Test desktop update source guard
        run: cargo test --locked --lib --manifest-path src/frontend/src-tauri/Cargo.toml
      - name: Build signed installers and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src/frontend
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.release.conf.json -- --locked
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Desktop ${{ needs.prepare.outputs.tag }}
          releaseBody: Save your work before installing an update.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
      - name: Publish direct updater download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern latest.json --dir updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" > updater/release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/fix_desktop_update_urls.py updater/latest.json updater/release.json --repository $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $env:RELEASE_TAG updater/latest.json --repo $env:GITHUB_REPOSITORY --clobber
