# OSV dependency scanning.
#
# Full scans use the exact dependency sets used by artifact-producing builds.
# PR differential scanning remains recursive so changes to other manifests are
# still compared against the target branch.

name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '22 20 * * 2'
  push:
    branches: [ "main" ]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
    with:
      scan-args: |-
        --lockfile=requirements.txt:./requirements/constraints-python312.txt
        --lockfile=./src/frontend/package-lock.json

  scan-resolved-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
    with:
      scan-args: |-
        --lockfile=requirements.txt:./requirements/constraints-python312.txt
        --lockfile=./src/frontend/package-lock.json

  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
    with:
      # Keep differential scanning recursive so manifest changes remain covered.
      scan-args: |-
        -r
        ./
