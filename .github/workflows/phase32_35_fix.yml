name: FortiGate Phases 32-35 Validation

on:
  push:
    branches:
      - fix/fortigate-phases-32-35

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout remaining phases branch
        uses: actions/checkout@v6
        with:
          ref: fix/fortigate-phases-32-35
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply phases 32-35 changes
        run: python scripts/_phase32_35_patch.py

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run phases 32-35 regression tests
        run: |
          python -m pytest \
            tests/test_fortigate_746_coverage_matrix.py \
            tests/test_fortigate_ssl_vpn_746.py \
            tests/test_fortigate_access_inventory.py \
            tests/test_fortigate_secret_leakage.py \
            -q

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run full suite for baseline comparison
        continue-on-error: true
        run: python -m pytest -q

      - name: Commit phases 32-35 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/fwmigrate/parsers/fortigate/model.py \
            src/fwmigrate/parsers/fortigate/parser.py \
            tests/test_fortigate_746_coverage_matrix.py
          if git diff --cached --quiet; then
            echo "No code changes to commit"
          else
            git commit -m "fix: complete FortiGate phases 32-35"
            git push origin HEAD:fix/fortigate-phases-32-35
          fi
